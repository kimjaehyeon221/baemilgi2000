name: Build and Submit iOS

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        required: false
        description: TestFlight changelog
        default: '배밀기 2000 업데이트'

jobs:
  build_ios:
    name: Build iOS app
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      changelog: ${{ inputs.changelog || '배밀기 2000 업데이트' }}
