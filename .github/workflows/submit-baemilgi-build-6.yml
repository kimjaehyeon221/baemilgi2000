name: Submit Baemilgi Build 6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/submit-baemilgi-build-6.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Submit Baemilgi iOS build 6 to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit --platform ios --id ae7be0d2-131e-455e-aa68-79712a109de1 --non-interactive --wait
