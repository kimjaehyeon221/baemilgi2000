name: Final Baemilgi Release Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-final-release-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Remove challenge countdown and refresh release copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Workout.tsx')
          s = p.read_text()
          s = s.replace(
            "  const beginCountdown = () => {\n    setCountdown(3);\n    setPhase('countdown');\n    Vibration.vibrate(15);\n  };",
            "  const beginCountdown = () => {\n    accumulatedMsRef.current = 0;\n    runningSinceRef.current = Date.now();\n    setSeconds(0);\n    setPhase('active');\n    Vibration.vibrate(20);\n  };"
          )
          s = s.replace(
            "              아직 완료된 기록이 아니야. 시작을 누르면 3·2·1 뒤 타이머가 켜지고, 직접 횟수를 세며 도전해.",
            "              아직 완료된 기록이 아니야. 시작을 누르면 바로 타이머가 켜지고, 직접 횟수를 세며 도전해."
          )
          s = s.replace('accessibilityLabel="3 2 1 뒤 도전 시작"', 'accessibilityLabel="도전 시작"')
          s = s.replace('<Text style={S.readyActionText}>3·2·1 뒤 도전 시작</Text>', '<Text style={S.readyActionText}>도전 시작</Text>')
          if "3·2·1 뒤 도전 시작" in s or "시작을 누르면 3·2·1" in s:
            raise SystemExit('Countdown copy still present')
          p.write_text(s)

          p = Path('STORE_METADATA.md')
          s = p.read_text()
          s = s.replace('앱이 정한 숫자가 아니라, 오늘 직접 측정한 기록에서 시작하는 200개의 배밀기 퀘스트.', '1개부터 시작해 200개의 퀘스트 끝에 2,000개까지 이어지는 배밀기 전용 훈련 기록 앱.')
          s = s.replace('- 목표 없는 첫 측정으로 실제 현재 수준 확인\n- 직접 센 횟수에서 다음 Quest 시작', '- 처음이라면 자세를 확인하고 1개 Quest부터 시작\n- 경험자라면 현재 수준에 맞는 지점에서 시작')
          p.write_text(s)

          p = Path('APP_REVIEW_NOTES.md')
          s = p.read_text()
          s = s.replace('2. 초보자: 공식 자세 안내 → 목표 숫자 없는 첫 기록 측정 → 실제 수행 횟수 직접 입력\n3. 경험자: 기존 배밀기 최고 기록 직접 입력', '2. 초보자: 공식 자세 안내 → 1개 Quest부터 시작\n3. 경험자: 현재 배밀기 수준을 입력해 적절한 지점에서 시작')
          s = s.replace('- 첫 측정은 목표 횟수를 제시하지 않으며 사용자가 직접 수행하고 직접 센 횟수를 입력함\n', '')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci
      - name: Validate core
        run: bash scripts/check-core.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Workout.tsx STORE_METADATA.md APP_REVIEW_NOTES.md
          git commit -m 'Remove Baemilgi challenge countdown and align review copy' || true
          git push origin HEAD:main

      - name: Update App Store metadata and review notes
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_APP_ID: '6806588875'
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          const b64=v=>Buffer.from(v).toString('base64url'), now=Math.floor(Date.now()/1000);
          const h=b64(JSON.stringify({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}));
          const p=b64(JSON.stringify({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+1200,aud:'appstoreconnect-v1'}));
          const input=h+'.'+p;
          const token=input+'.'+crypto.sign('sha256',Buffer.from(input),{key:process.env.ASC_API_KEY_P8,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const api=async(route,method='GET',body)=>{const r=await fetch('https://api.appstoreconnect.apple.com'+route,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const t=await r.text();const j=t?JSON.parse(t):{};if(!r.ok)throw new Error(method+' '+route+' '+r.status+' '+t);return j;};
          (async()=>{
            const versions=await api('/v1/apps/'+process.env.ASC_APP_ID+'/appStoreVersions?filter%5Bplatform%5D=IOS&limit=10');
            const version=(versions.data||[]).find(v=>v.attributes?.appStoreState==='PREPARE_FOR_SUBMISSION')||(versions.data||[])[0];
            const locs=await api('/v1/appStoreVersions/'+version.id+'/appStoreVersionLocalizations?limit=50');
            const description='배밀기 2000은 배밀기 한 가지에만 집중하는 훈련 기록 앱입니다.\n\n• 처음이라면 자세를 확인하고 1개 Quest부터 시작\n• 경험자라면 현재 수준에 맞는 지점에서 시작\n• 200개의 Quest를 따라 2,000개까지 진행\n• 높은 레벨을 성공하면 그 아래 레벨도 자동 완료\n• 아직 어렵다면 현재 기록 기준의 보조 훈련\n• 계정, 카메라, 광고 없이 이 iPhone에 기록 자동 저장\n• 기기 변경을 위한 기록 백업과 복원\n\n2,000은 의학적 권장량이 아니라 오래된 고반복 Dand 훈련 기록에서 가져온 상징적인 마지막 Quest입니다.';
            for(const loc of (locs.data||[])) await api('/v1/appStoreVersionLocalizations/'+loc.id,'PATCH',{data:{type:'appStoreVersionLocalizations',id:loc.id,attributes:{description,promotionalText:'1개부터 시작해 200개의 퀘스트 끝에 2,000개까지 이어지는 배밀기 전용 훈련 기록 앱.'}}});
            const review=await api('/v1/appStoreVersions/'+version.id+'/appStoreReviewDetail');
            if(review.data) await api('/v1/appStoreReviewDetails/'+review.data.id,'PATCH',{data:{type:'appStoreReviewDetails',id:review.data.id,attributes:{notes:'배밀기 2000은 계정이 필요 없는 단일 목적 운동 앱입니다. 첫 실행에서 배밀기 경험 여부를 선택합니다. 초보자는 자세 안내 후 1개 Quest부터 시작하고, 경험자는 현재 수준을 입력해 적절한 지점에서 시작합니다. Quest의 도전 시작 버튼을 누르면 별도 3·2·1 카운트다운 없이 바로 타이머가 시작되며 사용자가 횟수를 직접 셉니다. 기록은 기기에만 저장되고 JSON 백업/복원을 지원합니다. 카메라, 마이크, 위치, 광고, 추적, 서버 계정, 클라우드 동기화를 사용하지 않습니다. 2,000회는 의학적 권장량이 아닌 상징적 최종 Quest이며 치료·진단 효과를 주장하지 않습니다.'}}});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish corrected OTA to TestFlight build 10 runtime
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node - <<'NODE'
          const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.runtimeVersion='b12b6591130964d0702aae7e8e15f3d1c31fbd15';
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE
          CI=1 npx eas-cli@latest update --channel production --platform ios --environment production --message "Remove challenge countdown and align onboarding release" --non-interactive
