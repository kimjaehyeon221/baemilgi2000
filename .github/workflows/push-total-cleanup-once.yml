name: PUSH TOTAL Cleanup Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Repair focused cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'App.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const original = s;

          s = s.replace(
            "function parsePositiveInt(value: string) {\n  const number = Number(value.replace(/[^0-9]/g, ''));\n  if (!Number.isFinite(number) || number <= 0) return null;\n  return Math.floor(number);\n}\n\n",
            "",
          );

          s = s.replace(
            "        const rowFromBottom = rows - 1 - visualRow;\n",
            "",
          );

          if (s === original) throw new Error('Expected repair anchors were not present');
          fs.writeFileSync(path, s);
          console.log('Repaired PUSH TOTAL cleanup patch.');
          NODE

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --check
          git commit -m "Repair PUSH TOTAL wall cleanup"
          git push origin push-total-rc
