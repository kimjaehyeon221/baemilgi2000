name: Apply Wall Clock Timers

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/harden_wall_clock_timers.py'
      - '.github/workflows/apply-wall-clock-timers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Harden timers
        run: python3 scripts/harden_wall_clock_timers.py
      - name: Install dependencies
        run: npm ci
      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-wall-clock-qa
      - name: Commit timer hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Workout.tsx DESIGN.md RELEASE_QA.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Harden BAEMILGI wall-clock timers"
            git push origin main
          fi
