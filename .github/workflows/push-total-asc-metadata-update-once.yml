name: PUSH TOTAL ASC Metadata Update Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-asc-metadata-update-once.yml

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      PRIVACY_URL: 'https://github.com/kimjaehyeon221/web1/blob/main/push-total/PRIVACY.md'
      SUPPORT_URL: 'https://github.com/kimjaehyeon221/web1/blob/main/push-total/SUPPORT.md'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Update Korean App Store metadata
        run: node scripts/update-push-total-app-store-metadata.mjs
