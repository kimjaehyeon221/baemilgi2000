name: PUSH TOTAL ASC Metadata Update Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-asc-metadata-update-once.yml

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      PRIVACY_URL: 'https://push-total-support-upendjh-6028s-projects.vercel.app/privacy.html'
      SUPPORT_URL: 'https://push-total-support-upendjh-6028s-projects.vercel.app/support.html'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Update Korean App Store metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const appId = process.env.ASC_APP_ID;
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKey = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');
          const privacyUrl = process.env.PRIVACY_URL;
          const supportUrl = process.env.SUPPORT_URL;

          const subtitle = '푸쉬업을 위한 만보기';
          const promotionalText = '앞주머니에 넣고 푸쉬업하세요. 짧은 세트도 오늘과 평생 누적 기록에 차곡차곡 쌓입니다.';
          const keywords = '푸쉬업,팔굽혀펴기,운동,카운터,피트니스,홈트,기록,습관';
          const description = `푸쉬업도 걸음처럼 쌓이게.

PUSH TOTAL은 복잡한 운동 프로그램이 아니라, 푸쉬업 하나를 오래 기록하기 위한 가벼운 카운터입니다.

Pocket Count를 누르면 10초 준비가 시작됩니다. 처음 5초 안에 iPhone을 앞주머니에 넣고, 남은 5초는 시작 자세를 안정적으로 잡으세요. 시작음과 진동 뒤부터 iPhone의 동작 센서가 반복 움직임을 감지해 푸쉬업 횟수를 추정합니다.

마지막 푸쉬업 뒤 5초 동안 반복 움직임이 없으면 세트가 자동으로 종료되고 확인 화면으로 이동합니다. 센서가 센 횟수는 저장 전에 ±10 범위에서만 보정할 수 있습니다.

주요 기능
• 앞주머니 동작 센서를 이용한 Pocket Count
• 5초 넣기 + 5초 자세 잡기 준비 흐름
• 5초 무동작 자동 종료
• 저장 전 ±10 범위 보정
• 평생 누적 푸쉬업과 오늘 기록
• 이번 주 / 이번 달 / 최근 7일 기록
• 100 PUSHES = 1 BRICK 벽돌 누적 시각화
• Pocket Count 민감도 조정
• 개별 기록 삭제 및 전체 기록 초기화
• 기록 내보내기
• 계정 없이 로컬 저장

PUSH TOTAL은 카메라를 사용하지 않습니다. 원본 동작 센서 데이터는 서버로 전송하거나 보관하지 않습니다.

Pocket Count는 기기 위치, 주머니 형태, 운동 속도와 자세에 따라 오차가 생길 수 있습니다. 정확도가 맞지 않으면 세트 저장 전 보정하거나 민감도를 조절할 수 있습니다.`;

          const b64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64url(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'}))}.${b64url(JSON.stringify({iss:issuerId,iat:now-5,exp:now+600,aud:'appstoreconnect-v1'}))}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${signature}`;

          async function asc(path, options = {}) {
            const headers = {Authorization:`Bearer ${token}`};
            if (options.body) headers['Content-Type'] = 'application/json';
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method: options.method || 'GET',
              headers,
              body: options.body ? JSON.stringify(options.body) : undefined,
            });
            const text = await res.text();
            const body = text ? JSON.parse(text) : null;
            if (!res.ok) throw new Error(`ASC ${res.status} ${options.method || 'GET'} ${path}\n${JSON.stringify(body)}`);
            return body;
          }

          (async () => {
            const infos = await asc(`/v1/apps/${appId}/appInfos?limit=10`);
            const info = infos.data?.[0];
            if (!info) throw new Error('App Info not found');
            const infoLocs = await asc(`/v1/appInfos/${info.id}/appInfoLocalizations?limit=50`);
            const koInfo = (infoLocs.data || []).find(x => x.attributes?.locale === 'ko');
            if (!koInfo) throw new Error('Korean App Info localization not found');

            await asc(`/v1/appInfoLocalizations/${koInfo.id}`, {
              method: 'PATCH',
              body: {data:{type:'appInfoLocalizations',id:koInfo.id,attributes:{subtitle,privacyPolicyUrl:privacyUrl}}},
            });
            console.log('APP_INFO_UPDATED', JSON.stringify({locale:'ko',subtitle,privacyPolicyUrl:privacyUrl}));

            const versions = await asc(`/v1/apps/${appId}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50`);
            const version = (versions.data || []).find(x => x.attributes?.appStoreState === 'PREPARE_FOR_SUBMISSION') || versions.data?.[0];
            if (!version) throw new Error('iOS App Store version not found');
            const versionLocs = await asc(`/v1/appStoreVersions/${version.id}/appStoreVersionLocalizations?limit=50`);
            const koVersion = (versionLocs.data || []).find(x => x.attributes?.locale === 'ko');
            if (!koVersion) throw new Error('Korean version localization not found');

            await asc(`/v1/appStoreVersionLocalizations/${koVersion.id}`, {
              method: 'PATCH',
              body: {data:{type:'appStoreVersionLocalizations',id:koVersion.id,attributes:{description,keywords,promotionalText,supportUrl}}},
            });
            console.log('VERSION_LOCALIZATION_UPDATED', JSON.stringify({locale:'ko',version:version.attributes?.versionString,supportUrl,descriptionLength:description.length,keywords,promotionalText}));
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE
