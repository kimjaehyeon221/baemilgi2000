name: Apply Release Data Safety

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-release-data-safety.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply release hardening
        run: python scripts/release_harden.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit release hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx src/core.ts src/Onboarding.tsx docs/APP_STORE_RELEASE.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Harden BAEMILGI release data safety'
            git push
          fi
