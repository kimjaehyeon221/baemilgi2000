name: Finalize BAEMILGI Release UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-release-ui.yml'
  workflow_dispatch:

concurrency:
  group: baemilgi-final-ui
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply final UI system
        run: python3 scripts/finalize-release-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Core invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit verified UI
        run: |
          git config user.name "kimcat"
          git config user.email "79156711+kimjaehyeon221@users.noreply.github.com"
          git add App.tsx src/styles.ts src/Workout.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "Finalize BAEMILGI release UI system"
          git pull --rebase origin main
          git push origin main
