name: PUSH TOTAL Staging Build Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-staging-build-once.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: |
          npm run typecheck
          npm run doctor
          npx expo config --type public >/dev/null

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS TestFlight staging binary
        run: eas build --platform ios --profile staging --non-interactive --json
