name: Apply Release UX Hardening

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/release_ux_hardening.py'
      - '.github/workflows/apply-release-ux-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply release UX hardening
        run: python3 scripts/release_ux_hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-release-qa

      - name: Commit release UX hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src app.json DESIGN.md RELEASE_QA.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Harden BAEMILGI release UX"
            git push origin main
          fi
