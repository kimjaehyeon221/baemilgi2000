name: Baemilgi Final App Store Submit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-final-submit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      ASC_APP_ID: '6806588875'
      ASC_VERSION_ID: '8698e177-b678-44c3-9c36-2e483be9ad73'
      ASC_SUBMISSION_ID: '644b7b5a-47d6-4a25-8923-8cc99f53bbd9'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set free pricing, attach version, and submit
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const b64 = v => Buffer.from(v).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const h = b64(JSON.stringify({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}));
          const p = b64(JSON.stringify({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+1200,aud:'appstoreconnect-v1'}));
          const input = h + '.' + p;
          const token = input + '.' + crypto.sign('sha256', Buffer.from(input), {
            key: process.env.ASC_API_KEY_P8,
            dsaEncoding: 'ieee-p1363'
          }).toString('base64url');

          async function api(route, options={}) {
            const r = await fetch('https://api.appstoreconnect.apple.com' + route, {
              ...options,
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const text = await r.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch { body = {raw:text}; }
            return {ok:r.ok,status:r.status,body};
          }

          const containsVersion = (items, versionId) =>
            (items?.body?.included || []).some(x => x.type === 'appStoreVersions' && x.id === versionId) ||
            (items?.body?.data || []).some(x => x.relationships?.appStoreVersion?.data?.id === versionId);

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async()=>{
            const appId = process.env.ASC_APP_ID;
            const versionId = process.env.ASC_VERSION_ID;
            const submissionId = process.env.ASC_SUBMISSION_ID;
            const report = {checkedAt:new Date().toISOString(),appId,versionId,submissionId};

            // Ensure the app has an explicit price. Baemilgi 2000 is released as a free app.
            report.priceScheduleBefore = await api('/v1/apps/' + appId + '/appPriceSchedule?include=baseTerritory,manualPrices');
            const points = await api('/v1/apps/' + appId + '/appPricePoints?filter%5Bterritory%5D=KOR&include=territory&limit=200');
            report.korPricePointsStatus = {ok:points.ok,status:points.status,count:points.body?.data?.length ?? null};
            const freePoint = (points.body?.data || []).find(x => Number(x.attributes?.customerPrice) === 0);
            report.freePricePoint = freePoint ? {id:freePoint.id,customerPrice:freePoint.attributes?.customerPrice} : null;

            if (freePoint) {
              const tempId = '${freeprice-0}';
              report.setFreePriceAttempt = await api('/v1/appPriceSchedules', {
                method:'POST',
                body:JSON.stringify({
                  data:{
                    type:'appPriceSchedules',
                    relationships:{
                      app:{data:{type:'apps',id:appId}},
                      manualPrices:{data:[{type:'appPrices',id:tempId}]},
                      baseTerritory:{data:{type:'territories',id:'KOR'}}
                    }
                  },
                  included:[{
                    type:'appPrices',
                    id:tempId,
                    attributes:{startDate:null,endDate:null},
                    relationships:{
                      appPricePoint:{data:{type:'appPricePoints',id:freePoint.id}}
                    }
                  }]
                })
              });
              await sleep(1200);
            } else {
              report.setFreePriceAttempt = {ok:false,status:null,body:{error:'No zero-price KOR price point returned by Apple'}};
            }
            report.priceScheduleAfter = await api('/v1/apps/' + appId + '/appPriceSchedule?include=baseTerritory,manualPrices');

            const submission = await api('/v1/reviewSubmissions/' + submissionId);
            report.submissionBefore = submission;
            if (!submission.ok) {
              report.action = 'READ_SUBMISSION_FAILED';
              report.reason = 'Could not read review submission';
            } else if (submission.body?.data?.attributes?.state !== 'READY_FOR_REVIEW') {
              report.action = 'NO_SUBMIT';
              report.reason = 'Submission state is not READY_FOR_REVIEW';
            } else {
              let items = await api('/v1/reviewSubmissions/' + submissionId + '/items?limit=200&include=appStoreVersion');
              report.itemsBefore = items;
              if (!items.ok) {
                report.action = 'READ_ITEMS_FAILED';
                report.reason = 'Could not read review submission items';
              } else {
                let hasTargetVersion = containsVersion(items, versionId);
                report.hasTargetVersionBefore = hasTargetVersion;

                if (!hasTargetVersion) {
                  const addItem = await api('/v1/reviewSubmissionItems', {
                    method:'POST',
                    body:JSON.stringify({
                      data:{
                        type:'reviewSubmissionItems',
                        relationships:{
                          reviewSubmission:{data:{type:'reviewSubmissions',id:submissionId}},
                          appStoreVersion:{data:{type:'appStoreVersions',id:versionId}}
                        }
                      }
                    })
                  });
                  report.addItemAttempt = addItem;

                  items = await api('/v1/reviewSubmissions/' + submissionId + '/items?limit=200&include=appStoreVersion');
                  report.itemsAfterAdd = items;
                  hasTargetVersion = items.ok && containsVersion(items, versionId);
                  report.hasTargetVersionAfterAdd = hasTargetVersion;
                }

                if (!hasTargetVersion) {
                  report.action = 'ADD_ITEM_REJECTED_BY_APPLE';
                  report.reason = 'Target App Store version could not be attached to the review submission.';
                } else {
                  const submit = await api('/v1/reviewSubmissions/' + submissionId, {
                    method:'PATCH',
                    body:JSON.stringify({
                      data:{type:'reviewSubmissions',id:submissionId,attributes:{submitted:true}}
                    })
                  });
                  report.submitAttempt = submit;
                  report.action = submit.ok ? 'SUBMITTED' : 'SUBMIT_REJECTED_BY_APPLE';
                }
              }
            }

            const after = await api('/v1/reviewSubmissions/' + submissionId);
            report.submissionAfter = after;
            fs.mkdirSync('docs',{recursive:true});
            fs.writeFileSync('docs/BAEMILGI_FINAL_SUBMIT_RESULT.json', JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(err=>{
            const report={checkedAt:new Date().toISOString(),action:'WORKFLOW_ERROR',error:String(err?.stack||err)};
            fs.mkdirSync('docs',{recursive:true});
            fs.writeFileSync('docs/BAEMILGI_FINAL_SUBMIT_RESULT.json', JSON.stringify(report,null,2)+'\n');
            console.error(report.error);
          });
          NODE
      - name: Persist submit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/BAEMILGI_FINAL_SUBMIT_RESULT.json
          git commit -m 'Record Baemilgi final submit result' || exit 0
          git push origin HEAD:main
