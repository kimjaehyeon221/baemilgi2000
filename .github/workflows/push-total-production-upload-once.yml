name: PUSH TOTAL Production Upload Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-production-upload-once.yml

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD_ID: 0a9267da-d525-445e-a271-e196c6e7483a
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for production IPA
        run: |
          set -euo pipefail
          for i in {1..120}; do
            JSON="$(eas build:view "$BUILD_ID" --json)"
            STATUS="$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            echo "EAS_STATUS=$STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL="$(printf '%s' "$JSON" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("artifacts") or {}).get("buildUrl", ""))')"
              test -n "$URL"
              curl --fail --location --retry 3 "$URL" --output "$RUNNER_TEMP/PUSHTOTAL.ipa"
              echo "IPA_PATH=$RUNNER_TEMP/PUSHTOTAL.ipa" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Production build ended with $STATUS" >&2
              exit 1
            fi
            sleep 30
          done
          echo 'Timed out waiting for production build.' >&2
          exit 1

      - name: Prepare App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate IPA with Apple
        run: xcrun altool --validate-app --file "$IPA_PATH" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --p8-file-path "$ASC_KEY_PATH"

      - name: Upload IPA to App Store Connect
        run: xcrun altool --upload-app --file "$IPA_PATH" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --p8-file-path "$ASC_KEY_PATH"
