name: PUSH TOTAL Device Check Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-device-check-once.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: List registered iOS devices
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas device:list --apple-team-id "$APPLE_TEAM_ID" --json --non-interactive
