name: Apply Sequential Progression

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/lock_sequential_progression.py'
      - '.github/workflows/apply-sequential-progression.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Lock progression
        run: python3 scripts/lock_sequential_progression.py
      - name: Install dependencies
        run: npm ci
      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-sequential-qa
      - name: Commit progression guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/core.ts DESIGN.md RELEASE_QA.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Lock BAEMILGI sequential progression"
            git push origin main
          fi
