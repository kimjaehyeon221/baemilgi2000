name: Final Baemilgi Review Note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-final-review-note.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update App Review notes
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          REVIEW_DETAIL_ID: '0c30b92e-7e4b-46a9-9cfc-ad24f6dd1ebb'
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          const b64=v=>Buffer.from(v).toString('base64url'),now=Math.floor(Date.now()/1000);
          const h=b64(JSON.stringify({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}));
          const p=b64(JSON.stringify({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+1200,aud:'appstoreconnect-v1'}));
          const input=h+'.'+p;
          const token=input+'.'+crypto.sign('sha256',Buffer.from(input),{key:process.env.ASC_API_KEY_P8,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const notes=`PURPOSE / AUDIENCE\nBaemilgi 2000 is a lightweight exercise repetition, training, and quest-progress tracker for people who practice baemilgi (also commonly described as Hindu push-up / Dand-style conditioning). It is intended for general fitness users who want a simple way to set a target, record where they stopped, and progress through 200 quests up to the historical 2,000-repetition reference. The 2,000 figure is a historical challenge reference, not an exercise recommendation or medical target.\n\nHOW TO TEST\nNo account, login, subscription, purchase, camera, microphone, HealthKit access, wearable, or external hardware is required.\n1. Launch the app and tap “시작하기”.\n2. Choose “처음이에요” to view the three-step form guide and begin Quest 001, or choose “해본 적 있어요” and enter a first challenge target such as 10.\n3. Open a challenge. The app shows a 3 · 2 · 1 countdown before the timer starts. The user counts repetitions manually; there is no automatic repetition detection.\n4. Tap COMPLETE if the target is reached, or STOP HERE and enter the actual completed repetitions. Example: target 10, actual 9 -> current achieved level becomes 9 and the next quest becomes level 10.\n5. Open QUEST MAP to see completed levels marked with CLEAR stamps and the next available quest.\n6. Open TRAINING to see the locally generated set/repetition/rest suggestion based on current progress.\n7. Open 기록 / BAEMILGI RECORDS to review completed and stopped sessions.\n\nDATA / EXTERNAL SERVICES\nWorkout counts, quest progress, and training history are stored locally on the user's iPhone. No developer account or backend account is required. Expo EAS Update (expo-updates) is used only to deliver compatible app code fixes; limited technical update/diagnostic data may be processed by Expo as disclosed in the privacy policy. The app also contains optional links to its support/privacy pages and a historical reference source, but no external service is required to use or test the core app.\n\nREGIONAL DIFFERENCES\nThere are no region-specific features, content differences, login requirements, or geographic restrictions in the app. The same core functionality is available in all storefronts where the app is distributed.\n\nREGULATORY / THIRD-PARTY CONTENT\nThis app is not a medical device and does not diagnose, prevent, monitor, or treat any disease or physiological condition. It does not use HealthKit or access health records. It does not provide regulated financial, gambling, pharmaceutical, or medical services. There is no third-party login, user-generated content feed, licensed media catalog, or third-party commerce. The exercise guidance and interface content are provided within the app; historical references are presented only as contextual information.`;
          (async()=>{
            const r=await fetch('https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails/'+process.env.REVIEW_DETAIL_ID,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({data:{type:'appStoreReviewDetails',id:process.env.REVIEW_DETAIL_ID,attributes:{notes}}})});
            const text=await r.text(); if(!r.ok) throw new Error(r.status+' '+text); console.log('Review notes updated.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
