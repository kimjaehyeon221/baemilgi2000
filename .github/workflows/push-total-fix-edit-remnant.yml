name: PUSH TOTAL Fix Edit Remnant

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-fix-edit-remnant.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Remove obsolete edit reset
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'App.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const target = "          setEditingId(null);\n";
          if (!source.includes(target)) throw new Error('setEditingId remnant not found');
          source = source.replace(target, '');
          fs.writeFileSync(path, source);
          NODE

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --check
          git commit -m "Remove obsolete PUSH TOTAL edit reset"
          git push origin push-total-rc
