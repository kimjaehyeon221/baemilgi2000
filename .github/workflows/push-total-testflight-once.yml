name: PUSH TOTAL Masonry TestFlight Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-once.yml

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_ID: 605c4605-a2e0-419a-a273-c3f7d144eab1
      EXPO_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout masonry release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing EXPO_TOKEN"; exit 1; }
          test -n "$ASC_API_KEY_P8" || { echo "Missing APPLE_ASC_API_KEY_P8"; exit 1; }
          test -n "$EXPO_ASC_KEY_ID" || { echo "Missing APPLE_ASC_KEY_ID"; exit 1; }
          test -n "$EXPO_ASC_ISSUER_ID" || { echo "Missing APPLE_ASC_ISSUER_ID"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inject local ASC submit credentials
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.submit ??= {};
          config.submit.production ??= {};
          config.submit.production.ios ??= {};
          Object.assign(config.submit.production.ios, {
            ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
            ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID,
            ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
          });
          fs.writeFileSync('eas.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Verify masonry production build
        shell: bash
        run: |
          JSON="$(eas build:view "$BUILD_ID" --json)"
          STATUS="$(printf '%s' "$JSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.status||"")})')"
          echo "EAS build status: $STATUS"
          test "$STATUS" = "FINISHED"

      - name: Submit build 9 to TestFlight
        run: eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive --wait --verbose

      - name: Remove one-time dispatcher
        if: success()
        run: |
          git checkout -- eas.json
          rm .github/workflows/push-total-testflight-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/push-total-testflight-once.yml
          git commit -m "Remove one-time masonry TestFlight dispatcher"
          git push origin HEAD:push-total-rc
