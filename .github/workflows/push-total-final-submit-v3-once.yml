name: PUSH TOTAL Final Submit V3 Once

on:
  push:
    branches: [push-total-rc]
    paths:
      - '.github/workflows/push-total-final-submit-v3-once.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
    steps:
      - name: Replace draft submission and submit
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const appId=process.env.ASC_APP_ID,kid=process.env.ASC_KEY_ID,iss=process.env.ASC_ISSUER_ID,key=fs.readFileSync(process.env.ASC_KEY_PATH,'utf8');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const b=v=>Buffer.from(v).toString('base64url');
          function jwt(){const n=Math.floor(Date.now()/1000),u=`${b(JSON.stringify({alg:'ES256',kid,typ:'JWT'}))}.${b(JSON.stringify({iss,iat:n-5,exp:n+600,aud:'appstoreconnect-v1'}))}`;return `${u}.${crypto.sign('sha256',Buffer.from(u),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`}
          async function asc(path,opts={}){const h={Authorization:`Bearer ${jwt()}`};if(opts.body)h['Content-Type']='application/json';const r=await fetch(`https://api.appstoreconnect.apple.com${path}`,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok){const e=new Error(`ASC ${r.status} ${opts.method||'GET'} ${path}\n${typeof j==='string'?j:JSON.stringify(j)}`);e.status=r.status;e.body=j;throw e}return j}
          (async()=>{
            const vs=await asc(`/v1/apps/${appId}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50`);
            const v=(vs.data||[]).find(x=>x.attributes?.versionString==='1.0');
            if(!v) throw Error('version 1.0 missing');
            console.log('VERSION_BEFORE='+v.attributes?.appStoreState);
            if(['WAITING_FOR_REVIEW','IN_REVIEW','PENDING_APPLE_RELEASE','PROCESSING_FOR_DISTRIBUTION','READY_FOR_DISTRIBUTION'].includes(v.attributes?.appStoreState)){
              console.log('ALREADY_SUBMITTED=true');return;
            }

            const drafts=await asc(`/v1/apps/${appId}/reviewSubmissions?filter%5Bstate%5D=READY_FOR_REVIEW&filter%5Bplatform%5D=IOS&limit=50`);
            for(const d of (drafts.data||[])){
              console.log('DELETE_DRAFT='+d.id);
              try{await asc(`/v1/reviewSubmissions/${d.id}`,{method:'DELETE'});console.log('DRAFT_DELETED='+d.id)}
              catch(e){console.log('DRAFT_DELETE_FAILED='+e.status);if(e.body)console.log(JSON.stringify(e.body));throw e;}
            }

            const created=await asc('/v1/reviewSubmissions',{method:'POST',body:{data:{type:'reviewSubmissions',attributes:{platform:'IOS'},relationships:{app:{data:{type:'apps',id:appId}},appStoreVersionForReview:{data:{type:'appStoreVersions',id:v.id}}}}}});
            const sub=created.data;
            console.log('NEW_REVIEW_SUBMISSION='+sub.id);
            const chk=await asc(`/v1/reviewSubmissions/${sub.id}?include=appStoreVersionForReview`);
            const linked=(chk.included||[]).find(x=>x.type==='appStoreVersions');
            console.log('VERSION_LINKED='+(linked?.id===v.id));
            if(linked?.id!==v.id) throw Error('App Store version 1.0 did not link to submission');

            await asc(`/v1/reviewSubmissions/${sub.id}`,{method:'PATCH',body:{data:{type:'reviewSubmissions',id:sub.id,attributes:{submitted:true}}}});
            console.log('SUBMIT_REQUEST_SENT=true');
            await sleep(5000);
            const fin=await asc(`/v1/reviewSubmissions/${sub.id}`);
            console.log('REVIEW_SUBMISSION_STATE='+fin.data?.attributes?.state);
            const vv=await asc(`/v1/appStoreVersions/${v.id}`);
            console.log('VERSION_AFTER='+vv.data?.attributes?.appStoreState);
          })().catch(e=>{console.error(e.stack||e);if(e.body)console.error(JSON.stringify(e.body));process.exit(1)});
          NODE
