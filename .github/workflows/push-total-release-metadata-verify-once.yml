name: PUSH TOTAL Release Metadata Verify Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-release-metadata-verify-once.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      PRIVACY_URL: 'https://push-total-support-upendjh-6028s-projects.vercel.app/privacy.html'
      SUPPORT_URL: 'https://push-total-support-upendjh-6028s-projects.vercel.app/support.html'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Diagnose public pages
        id: pages
        continue-on-error: true
        run: |
          PRIVACY_RESULT=$(curl --silent --show-error --location --max-time 20 --output /tmp/privacy.html --write-out '%{http_code} %{url_effective}' "$PRIVACY_URL")
          SUPPORT_RESULT=$(curl --silent --show-error --location --max-time 20 --output /tmp/support.html --write-out '%{http_code} %{url_effective}' "$SUPPORT_URL")
          echo "PRIVACY_HTTP $PRIVACY_RESULT"
          echo "SUPPORT_HTTP $SUPPORT_RESULT"
          echo 'PRIVACY_HEAD'
          head -c 400 /tmp/privacy.html | tr '\n' ' '
          echo
          echo 'SUPPORT_HEAD'
          head -c 400 /tmp/support.html | tr '\n' ' '
          echo
          grep -q 'PUSH TOTAL' /tmp/privacy.html
          grep -q 'PUSH TOTAL' /tmp/support.html
          echo 'PUBLIC_PAGES_OK'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify App Store metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const appId = process.env.ASC_APP_ID;
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKey = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');
          const expectedPrivacy = process.env.PRIVACY_URL;
          const expectedSupport = process.env.SUPPORT_URL;
          const b64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64url(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'}))}.${b64url(JSON.stringify({iss:issuerId,iat:now-5,exp:now+600,aud:'appstoreconnect-v1'}))}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${signature}`;
          async function asc(path) {
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {headers:{Authorization:`Bearer ${token}`}});
            const body = await res.json();
            if (!res.ok) throw new Error(JSON.stringify(body));
            return body;
          }
          const infos = await asc(`/v1/apps/${appId}/appInfos?limit=10`);
          const info = infos.data?.[0];
          const infoLocs = await asc(`/v1/appInfos/${info.id}/appInfoLocalizations?limit=50`);
          const koInfo = infoLocs.data.find(x => x.attributes?.locale === 'ko');
          const versions = await asc(`/v1/apps/${appId}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50`);
          const version = versions.data.find(x => x.attributes?.appStoreState === 'PREPARE_FOR_SUBMISSION') || versions.data[0];
          const versionLocs = await asc(`/v1/appStoreVersions/${version.id}/appStoreVersionLocalizations?limit=50`);
          const koVersion = versionLocs.data.find(x => x.attributes?.locale === 'ko');
          const a = koInfo.attributes || {};
          const v = koVersion.attributes || {};
          const checks = {
            subtitle: a.subtitle === '푸쉬업을 위한 만보기',
            privacy: a.privacyPolicyUrl === expectedPrivacy,
            description: Boolean(v.description && v.description.includes('5초') && v.description.includes('Pocket Count')),
            keywords: Boolean(v.keywords && v.keywords.includes('푸쉬업')),
            promotionalText: Boolean(v.promotionalText),
            support: v.supportUrl === expectedSupport,
          };
          console.log('METADATA_CHECKS', JSON.stringify(checks));
          console.log('VERSION_STATE', JSON.stringify({version:version.attributes?.versionString,state:version.attributes?.appStoreState}));
          if (Object.values(checks).some(x => !x)) process.exit(1);
          NODE
