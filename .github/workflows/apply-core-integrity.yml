name: Apply Core Integrity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-core-integrity.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply core integrity patch
        run: python scripts/core_integrity_release.py

      - name: Install dependencies
        run: npm ci

      - name: Core invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit core integrity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core.ts
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Harden BAEMILGI core progression integrity'
            git push
          fi
