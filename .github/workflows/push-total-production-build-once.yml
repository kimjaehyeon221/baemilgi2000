name: PUSH TOTAL Production Build Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-production-build-once.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify public runtime
        run: |
          node -e "const c=require('./app.json').expo; if(c.version!=='1.0.0') process.exit(1); console.log('PUBLIC_RUNTIME', c.version, c.ios.runtimeVersion.policy)"

      - name: Queue iOS production build
        run: eas build --platform ios --profile production --non-interactive --no-wait --json
