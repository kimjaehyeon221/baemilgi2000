name: Diagnose PUSH TOTAL TestFlight

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-total-testflight-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Inspect App Store Connect TestFlight state
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_APP_ID: '6806938654'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const key = process.env.ASC_API_KEY_P8;
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const appId = process.env.ASC_APP_ID;
          if (!key || !keyId || !issuerId || !appId) throw new Error('Missing App Store Connect credentials or app id');

          const b64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({ iss: issuerId, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }));
          const input = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(input), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${input}.${signature}`;

          async function asc(path) {
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 500) }; }
            if (!res.ok) throw new Error(`ASC ${res.status} ${path}: ${JSON.stringify(body)}`);
            return body;
          }

          (async () => {
            const app = await asc(`/v1/apps/${appId}`);
            const builds = await asc(`/v1/builds?filter%5Bapp%5D=${appId}&sort=-uploadedDate&limit=20&include=preReleaseVersion`);
            const groups = await asc(`/v1/betaGroups?filter%5Bapp%5D=${appId}&limit=200`);
            const testers = await asc(`/v1/betaTesters?limit=200`);
            const users = await asc(`/v1/users?limit=200&include=visibleApps&limit%5BvisibleApps%5D=50`);

            const includedBuilds = new Map((builds.included || []).map(x => [x.id, x]));
            const latest = builds.data?.[0] || null;
            let latestMarketingVersion = null;
            if (latest?.relationships?.preReleaseVersion?.data?.id) {
              latestMarketingVersion = includedBuilds.get(latest.relationships.preReleaseVersion.data.id)?.attributes?.version || null;
            }

            const groupSummaries = [];
            for (const group of groups.data || []) {
              const [groupBuilds, groupTesters] = await Promise.all([
                asc(`/v1/betaGroups/${group.id}/builds?limit=200`),
                asc(`/v1/betaGroups/${group.id}/betaTesters?limit=200`)
              ]);
              groupSummaries.push({
                id: group.id,
                name: group.attributes?.name || null,
                isInternalGroup: Boolean(group.attributes?.isInternalGroup),
                hasAccessToAllBuilds: Boolean(group.attributes?.hasAccessToAllBuilds),
                publicLinkEnabled: Boolean(group.attributes?.publicLinkEnabled),
                buildCount: groupBuilds.data?.length || 0,
                testerCount: groupTesters.data?.length || 0,
                latestBuildAssigned: latest ? (groupBuilds.data || []).some(b => b.id === latest.id) : false
              });
            }

            const eligibleRoles = new Set(['ACCOUNT_HOLDER', 'ADMIN', 'APP_MANAGER', 'DEVELOPER', 'MARKETING']);
            const eligibleUsers = (users.data || []).filter(user => {
              const roles = user.attributes?.roles || [];
              const roleEligible = roles.some(role => eligibleRoles.has(role));
              const appVisible = Boolean(user.attributes?.allAppsVisible) ||
                (user.relationships?.visibleApps?.data || []).some(app => app.id === appId);
              return roleEligible && appVisible;
            });

            const testerByEmail = new Map((testers.data || [])
              .filter(t => t.attributes?.email)
              .map(t => [String(t.attributes.email).trim().toLowerCase(), t]));
            const eligibleUserTesterMatches = eligibleUsers
              .map(user => ({ user, tester: testerByEmail.get(String(user.attributes?.username || '').trim().toLowerCase()) }))
              .filter(x => x.tester);

            let diagnosis = 'UNKNOWN';
            if (!latest) diagnosis = 'NO_BUILD';
            else if (latest.attributes?.processingState !== 'VALID') diagnosis = 'BUILD_NOT_VALID';
            else {
              const internal = groupSummaries.filter(g => g.isInternalGroup);
              const assigned = internal.filter(g => g.latestBuildAssigned || g.hasAccessToAllBuilds);
              if (internal.length === 0) diagnosis = 'NO_INTERNAL_GROUP';
              else if (assigned.length === 0) diagnosis = 'BUILD_NOT_ASSIGNED_TO_INTERNAL_GROUP';
              else if (!assigned.some(g => g.testerCount > 0)) {
                if (eligibleUserTesterMatches.length === 1) diagnosis = 'SAFE_TO_ASSIGN_MATCHED_INTERNAL_TESTER';
                else if (eligibleUsers.length === 1 && eligibleUserTesterMatches.length === 0) diagnosis = 'ELIGIBLE_INTERNAL_USER_NEEDS_TESTER_RECORD';
                else diagnosis = 'NO_TESTERS_IN_ASSIGNED_INTERNAL_GROUP';
              } else diagnosis = 'READY_FOR_INTERNAL_TESTING';
            }

            const report = {
              checkedAt: new Date().toISOString(),
              app: {
                id: app.data?.id || appId,
                name: app.data?.attributes?.name || null,
                bundleId: app.data?.attributes?.bundleId || null,
                sku: app.data?.attributes?.sku || null
              },
              latestBuild: latest ? {
                id: latest.id,
                buildNumber: latest.attributes?.version || null,
                marketingVersion: latestMarketingVersion,
                processingState: latest.attributes?.processingState || null,
                uploadedDate: latest.attributes?.uploadedDate || null,
                expired: Boolean(latest.attributes?.expired)
              } : null,
              betaTesterCountOnAccount: testers.data?.length || 0,
              appStoreConnectUserCount: users.data?.length || 0,
              eligibleInternalUserCount: eligibleUsers.length,
              eligibleUserWithExistingTesterCount: eligibleUserTesterMatches.length,
              groups: groupSummaries,
              diagnosis
            };

            fs.mkdirSync('docs', { recursive: true });
            fs.writeFileSync('docs/PUSH_TOTAL_TESTFLIGHT_STATUS.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify({
              diagnosis,
              latestBuild: report.latestBuild,
              eligibleInternalUserCount: report.eligibleInternalUserCount,
              eligibleUserWithExistingTesterCount: report.eligibleUserWithExistingTesterCount,
              groups: groupSummaries.map(g => ({ name: g.name, internal: g.isInternalGroup, builds: g.buildCount, testers: g.testerCount, latest: g.latestBuildAssigned }))
            }, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Persist sanitized diagnosis
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PUSH_TOTAL_TESTFLIGHT_STATUS.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
          else
            git commit -m 'Record PUSH TOTAL TestFlight diagnosis'
            git push origin HEAD:main
          fi
