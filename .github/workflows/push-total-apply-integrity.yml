name: Apply PUSH TOTAL Cadence Integrity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-total-apply-integrity.yml'
      - 'scripts/push_total_integrity_pass.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Load refinement script from main
        run: |
          git fetch origin main
          git show origin/main:scripts/push_total_integrity_pass.js > /tmp/push_total_integrity_pass.js

      - name: Install cadence audio dependency
        run: npm install expo-audio@~57.0.4 --save-exact

      - name: Generate local cadence tones
        run: |
          mkdir -p assets
          node <<'NODE'
          const fs = require('fs');
          function wav(path, frequency, duration, volume = 0.42) {
            const rate = 44100;
            const samples = Math.floor(rate * duration);
            const dataSize = samples * 2;
            const buffer = Buffer.alloc(44 + dataSize);
            buffer.write('RIFF', 0);
            buffer.writeUInt32LE(36 + dataSize, 4);
            buffer.write('WAVE', 8);
            buffer.write('fmt ', 12);
            buffer.writeUInt32LE(16, 16);
            buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22);
            buffer.writeUInt32LE(rate, 24);
            buffer.writeUInt32LE(rate * 2, 28);
            buffer.writeUInt16LE(2, 32);
            buffer.writeUInt16LE(16, 34);
            buffer.write('data', 36);
            buffer.writeUInt32LE(dataSize, 40);
            for (let i = 0; i < samples; i++) {
              const t = i / rate;
              const edge = Math.min(1, i / (rate * 0.012), (samples - i - 1) / (rate * 0.018));
              const harmonic = Math.sin(2 * Math.PI * frequency * t) + 0.18 * Math.sin(2 * Math.PI * frequency * 2 * t);
              const sample = Math.max(-1, Math.min(1, harmonic * volume * Math.max(0, edge)));
              buffer.writeInt16LE(Math.round(sample * 32767), 44 + i * 2);
            }
            fs.writeFileSync(path, buffer);
          }
          wav('assets/cadence-start.wav', 1120, 0.28, 0.48);
          wav('assets/cadence-down.wav', 560, 0.12, 0.40);
          wav('assets/cadence-up.wav', 880, 0.12, 0.40);
          NODE

      - name: Apply product refinement
        run: node /tmp/push_total_integrity_pass.js

      - name: TypeScript validation
        run: npm run typecheck

      - name: iOS bundle validation
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Commit verified PUSH TOTAL changes
        run: |
          rm -rf dist-ios
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx package.json package-lock.json assets/cadence-start.wav assets/cadence-down.wav assets/cadence-up.wav
          if git diff --cached --quiet; then
            echo 'No PUSH TOTAL changes to commit.'
          else
            git commit -m 'Refine PUSH TOTAL cadence and record integrity'
            git push origin HEAD:push-total-rc
          fi
