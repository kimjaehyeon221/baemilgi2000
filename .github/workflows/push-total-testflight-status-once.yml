name: PUSH TOTAL TestFlight Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-status-once.yml

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout masonry release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Read successful submission record
        run: eas submit:view c2487e98-daab-47ba-a658-690fad1332fa --json

      - name: Read Expo ASC project integration
        run: eas integrations:asc:status --json --non-interactive

      - name: List recent iOS submissions
        run: eas submit:list --platform ios --limit 10 --json --non-interactive
