name: PUSH TOTAL TestFlight Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-status-once.yml
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_BUILD_NUMBER: '9'
      ASC_EXPECTED_BUNDLE_ID: 'com.magpie221.pushtotal'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "Missing APPLE_ASC_API_KEY_P8"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "Missing APPLE_ASC_KEY_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing APPLE_ASC_ISSUER_ID"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Ensure account holder can install build 9 in TestFlight
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const buildNumber = process.env.ASC_BUILD_NUMBER;
            const expectedBundleId = process.env.ASC_EXPECTED_BUNDLE_ID;
            const keyId = process.env.ASC_KEY_ID;
            const issuerId = process.env.ASC_ISSUER_ID;
            const privateKey = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');

            const b64url = value => Buffer.from(value).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }))}.${b64url(JSON.stringify({ iss: issuerId, iat: now - 5, exp: now + 600, aud: 'appstoreconnect-v1' }))}`;
            const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            const token = `${unsigned}.${signature}`;

            async function asc(path, options = {}) {
              const method = options.method || 'GET';
              const headers = { Authorization: `Bearer ${token}` };
              if (options.body !== undefined) headers['Content-Type'] = 'application/json';
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
                method,
                headers,
                body: options.body === undefined ? undefined : JSON.stringify(options.body),
              });
              const text = await res.text();
              let body = null;
              if (text) {
                try { body = JSON.parse(text); } catch { body = { raw: text }; }
              }
              if (!res.ok) throw new Error(`ASC ${res.status} ${method} ${path}\n${JSON.stringify(body)}`);
              return body;
            }

            const app = await asc(`/v1/apps/${appId}?fields%5Bapps%5D=name,bundleId`);
            const appSummary = { id: app.data.id, name: app.data.attributes.name, bundleId: app.data.attributes.bundleId };
            console.log('APP', JSON.stringify(appSummary));
            if (appSummary.bundleId !== expectedBundleId) throw new Error(`Bundle ID mismatch: expected ${expectedBundleId}, got ${appSummary.bundleId}`);

            const builds = await asc(`/v1/builds?filter%5Bapp%5D=${appId}&filter%5Bversion%5D=${encodeURIComponent(buildNumber)}&include=betaGroups,preReleaseVersion&fields%5Bbuilds%5D=version,processingState,expired,betaGroups,preReleaseVersion&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds&fields%5BpreReleaseVersions%5D=version,platform&limit=10`);
            const build = builds.data?.[0];
            if (!build) throw new Error('Build 9 is not visible in App Store Connect');
            if (build.attributes.processingState !== 'VALID' || build.attributes.expired) {
              throw new Error(`Build 9 is not install-ready: ${build.attributes.processingState}`);
            }
            console.log('BUILD_VALID', build.attributes.version);

            const groups = await asc(`/v1/betaGroups?filter%5Bapp%5D=${appId}&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds&limit=200`);
            const group = (groups.data || []).find(g => g.attributes?.isInternalGroup && g.attributes?.name === 'Team (Expo)');
            if (!group) throw new Error('Internal TestFlight group Team (Expo) not found');
            console.log('INTERNAL_GROUP_FOUND', group.id);

            const users = await asc(`/v1/users?fields%5Busers%5D=username,firstName,lastName,roles&limit=200`);
            const accountHolders = (users.data || []).filter(u => (u.attributes?.roles || []).includes('ACCOUNT_HOLDER'));
            if (accountHolders.length !== 1) throw new Error(`Expected exactly one Account Holder, found ${accountHolders.length}`);
            const owner = accountHolders[0].attributes;
            console.log('ACCOUNT_HOLDER_FOUND');

            let groupTesters = await asc(`/v1/betaGroups/${group.id}/betaTesters?fields%5BbetaTesters%5D=state,inviteType,email&limit=200`);
            let tester = (groupTesters.data || []).find(t => t.attributes?.email?.toLowerCase() === owner.username.toLowerCase());

            if (!tester) {
              const existing = await asc(`/v1/betaTesters?filter%5Bemail%5D=${encodeURIComponent(owner.username)}&fields%5BbetaTesters%5D=state,inviteType,email&limit=10`);
              tester = existing.data?.[0] || null;

              if (tester) {
                await asc(`/v1/betaTesters/${tester.id}/relationships/betaGroups`, {
                  method: 'POST',
                  body: { data: [{ type: 'betaGroups', id: group.id }] },
                });
                console.log('TESTER_ADDED_TO_GROUP', tester.id);
              } else {
                const created = await asc('/v1/betaTesters', {
                  method: 'POST',
                  body: {
                    data: {
                      type: 'betaTesters',
                      attributes: {
                        email: owner.username,
                        firstName: owner.firstName,
                        lastName: owner.lastName,
                      },
                      relationships: {
                        betaGroups: {
                          data: [{ type: 'betaGroups', id: group.id }],
                        },
                      },
                    },
                  },
                });
                tester = created.data;
                console.log('TESTER_CREATED', tester.id);
              }
            } else {
              console.log('TESTER_ALREADY_IN_GROUP', tester.id);
            }

            groupTesters = await asc(`/v1/betaGroups/${group.id}/betaTesters?fields%5BbetaTesters%5D=state,inviteType,email&limit=200`);
            tester = (groupTesters.data || []).find(t => t.attributes?.email?.toLowerCase() === owner.username.toLowerCase());
            if (!tester) throw new Error('Account Holder was not present in the internal TestFlight group after update');

            console.log('TESTFLIGHT_TESTER', JSON.stringify({
              id: tester.id,
              state: tester.attributes?.state || null,
              inviteType: tester.attributes?.inviteType || null,
              groupTesterCount: (groupTesters.data || []).length,
            }));
          }

          main().catch(error => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
