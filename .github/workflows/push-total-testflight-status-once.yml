name: PUSH TOTAL TestFlight Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-status-once.yml
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_BUILD_NUMBER: '9'
      ASC_EXPECTED_BUNDLE_ID: 'com.magpie221.pushtotal'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "Missing APPLE_ASC_API_KEY_P8"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "Missing APPLE_ASC_KEY_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing APPLE_ASC_ISSUER_ID"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inspect account holder and existing beta tester state
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const keyId = process.env.ASC_KEY_ID;
            const issuerId = process.env.ASC_ISSUER_ID;
            const privateKey = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');
            const b64url = value => Buffer.from(value).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }))}.${b64url(JSON.stringify({ iss: issuerId, iat: now - 5, exp: now + 600, aud: 'appstoreconnect-v1' }))}`;
            const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            const token = `${unsigned}.${signature}`;

            async function asc(path) {
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, { headers: { Authorization: `Bearer ${token}` } });
              const text = await res.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { raw: text }; }
              if (!res.ok) throw new Error(`ASC ${res.status} ${path}\n${JSON.stringify(body)}`);
              return body;
            }

            const app = await asc(`/v1/apps/${appId}?fields%5Bapps%5D=name,bundleId`);
            console.log('APP', JSON.stringify({ id: app.data.id, name: app.data.attributes.name, bundleId: app.data.attributes.bundleId }));

            const users = await asc(`/v1/users?fields%5Busers%5D=username,firstName,lastName,roles,allAppsVisible&limit=200`);
            const holders = (users.data || []).filter(u => (u.attributes?.roles || []).includes('ACCOUNT_HOLDER'));
            if (holders.length !== 1) throw new Error(`Expected one Account Holder, found ${holders.length}`);
            const holder = holders[0];
            console.log('ACCOUNT_HOLDER', JSON.stringify({ id: holder.id, roles: holder.attributes.roles, allAppsVisible: holder.attributes.allAppsVisible }));

            const testers = await asc(`/v1/betaTesters?filter%5Bemail%5D=${encodeURIComponent(holder.attributes.username)}&include=apps,betaGroups,builds&fields%5BbetaTesters%5D=state,inviteType,email,apps,betaGroups,builds&fields%5Bapps%5D=name,bundleId&fields%5BbetaGroups%5D=name,isInternalGroup&fields%5Bbuilds%5D=version,processingState&limit=10`);
            console.log('TESTER_COUNT', (testers.data || []).length);
            for (const tester of testers.data || []) {
              const rel = tester.relationships || {};
              const ids = type => (rel[type]?.data || []).map(x => x.id);
              const included = testers.included || [];
              const byId = new Map(included.map(x => [x.id, x]));
              const apps = ids('apps').map(id => byId.get(id)).filter(Boolean).map(x => ({ id: x.id, name: x.attributes?.name, bundleId: x.attributes?.bundleId }));
              const groups = ids('betaGroups').map(id => byId.get(id)).filter(Boolean).map(x => ({ id: x.id, name: x.attributes?.name, internal: x.attributes?.isInternalGroup }));
              const builds = ids('builds').map(id => byId.get(id)).filter(Boolean).map(x => ({ id: x.id, version: x.attributes?.version, processingState: x.attributes?.processingState }));
              console.log('TESTER', JSON.stringify({ id: tester.id, state: tester.attributes?.state, inviteType: tester.attributes?.inviteType, apps, groups, builds }));
            }

            const targetGroup = await asc(`/v1/betaGroups?filter%5Bapp%5D=${appId}&filter%5Bname%5D=${encodeURIComponent('Team (Expo)')}&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds&limit=10`);
            console.log('TARGET_GROUP', JSON.stringify((targetGroup.data || []).map(g => ({ id: g.id, ...g.attributes }))));
          }

          main().catch(error => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
