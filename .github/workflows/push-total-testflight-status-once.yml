name: PUSH TOTAL TestFlight Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-status-once.yml
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_APP_ID: '6806938654'
      ASC_BUILD_NUMBER: '9'
      ASC_EXPECTED_BUNDLE_ID: 'com.magpie221.pushtotal'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: Checkout masonry release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          test -n "$ASC_API_KEY_P8" || { echo "Missing APPLE_ASC_API_KEY_P8"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "Missing APPLE_ASC_KEY_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing APPLE_ASC_ISSUER_ID"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inspect build upload and TestFlight readiness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const buildNumber = process.env.ASC_BUILD_NUMBER;
            const expectedBundleId = process.env.ASC_EXPECTED_BUNDLE_ID;
            const keyId = process.env.ASC_KEY_ID;
            const issuerId = process.env.ASC_ISSUER_ID;
            const privateKey = fs.readFileSync(process.env.ASC_KEY_PATH, 'utf8');

            const b64url = value => Buffer.from(value).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }))}.${b64url(JSON.stringify({ iss: issuerId, iat: now - 5, exp: now + 600, aud: 'appstoreconnect-v1' }))}`;
            const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            const token = `${unsigned}.${signature}`;

            async function asc(path) {
              const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, { headers: { Authorization: `Bearer ${token}` } });
              const text = await res.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { raw: text }; }
              if (!res.ok) throw new Error(`ASC ${res.status} ${path}\n${JSON.stringify(body)}`);
              return body;
            }

            const app = await asc(`/v1/apps/${appId}?fields%5Bapps%5D=name,bundleId`);
            const appSummary = { id: app.data.id, name: app.data.attributes.name, bundleId: app.data.attributes.bundleId };
            console.log('APP', JSON.stringify(appSummary));
            if (appSummary.bundleId !== expectedBundleId) throw new Error(`Bundle ID mismatch: expected ${expectedBundleId}, got ${appSummary.bundleId}`);

            const uploadList = await asc(`/v1/apps/${appId}/buildUploads?fields%5BbuildUploads%5D=cfBundleShortVersionString,cfBundleVersion,createdDate,state,platform,uploadedDate,build&include=build&fields%5Bbuilds%5D=version,uploadedDate,expirationDate,expired,processingState,buildAudienceType,usesNonExemptEncryption,betaGroups,preReleaseVersion&limit=200`);
            const uploads = (uploadList.data || []).map(x => ({ id: x.id, ...x.attributes }));
            const upload = uploads.find(x => x.cfBundleVersion === buildNumber);
            if (!upload) {
              console.log('UPLOAD_NOT_VISIBLE_YET');
              console.log('RECENT_UPLOADS', JSON.stringify(uploads.slice(-10).map(x => ({ id: x.id, version: x.cfBundleShortVersionString, build: x.cfBundleVersion, state: x.state, uploadedDate: x.uploadedDate }))));
              return;
            }
            console.log('UPLOAD', JSON.stringify(upload));

            const builds = await asc(`/v1/builds?filter%5Bapp%5D=${appId}&filter%5Bversion%5D=${encodeURIComponent(buildNumber)}&include=preReleaseVersion,betaGroups&fields%5Bbuilds%5D=version,uploadedDate,expirationDate,expired,processingState,buildAudienceType,usesNonExemptEncryption,preReleaseVersion,betaGroups&fields%5BpreReleaseVersions%5D=version,platform&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds,publicLinkEnabled&limit=10`);
            const build = builds.data?.[0];
            if (!build) {
              console.log('BUILD_NOT_VISIBLE_YET');
              return;
            }

            const included = builds.included || [];
            const prerelease = included.find(x => x.type === 'preReleaseVersions');
            const attachedGroups = included.filter(x => x.type === 'betaGroups').map(x => ({
              id: x.id,
              name: x.attributes?.name,
              internal: x.attributes?.isInternalGroup,
              allBuilds: x.attributes?.hasAccessToAllBuilds,
              publicLinkEnabled: x.attributes?.publicLinkEnabled,
            }));
            console.log('BUILD', JSON.stringify({
              id: build.id,
              buildNumber: build.attributes.version,
              appVersion: prerelease?.attributes?.version || null,
              platform: prerelease?.attributes?.platform || null,
              processingState: build.attributes.processingState,
              expired: build.attributes.expired,
              uploadedDate: build.attributes.uploadedDate,
              expirationDate: build.attributes.expirationDate,
              buildAudienceType: build.attributes.buildAudienceType,
              usesNonExemptEncryption: build.attributes.usesNonExemptEncryption,
              attachedGroups,
            }));

            const groups = await asc(`/v1/betaGroups?filter%5Bapp%5D=${appId}&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds,publicLinkEnabled&limit=200`);
            const summaries = [];
            for (const group of groups.data || []) {
              const testers = await asc(`/v1/betaGroups/${group.id}/betaTesters?fields%5BbetaTesters%5D=state,inviteType,email,firstName,lastName&limit=200`);
              const states = {};
              for (const tester of testers.data || []) {
                const state = tester.attributes?.state || 'UNKNOWN';
                states[state] = (states[state] || 0) + 1;
              }
              summaries.push({
                id: group.id,
                name: group.attributes.name,
                internal: group.attributes.isInternalGroup,
                allBuilds: group.attributes.hasAccessToAllBuilds,
                publicLinkEnabled: group.attributes.publicLinkEnabled,
                testerCount: (testers.data || []).length,
                testerStates: states,
                testers: (testers.data || []).map(t => ({ id: t.id, ...t.attributes })),
              });
            }
            console.log('GROUPS', JSON.stringify(summaries));

            try {
              const users = await asc(`/v1/users?fields%5Busers%5D=username,firstName,lastName,roles&limit=200`);
              console.log('ASC_USERS', JSON.stringify((users.data || []).map(u => ({ id: u.id, ...u.attributes }))));
            } catch (error) {
              console.log('ASC_USERS_UNAVAILABLE', error.message);
            }
          }

          main().catch(error => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
