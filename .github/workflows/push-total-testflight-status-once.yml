name: PUSH TOTAL TestFlight Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-testflight-status-once.yml

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
    steps:
      - name: Checkout masonry release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Connect correct App Store Connect app
        run: eas integrations:asc:connect --asc-app-id 6806588875 --api-key-id "$EXPO_ASC_KEY_ID" --json --non-interactive

      - name: Verify ASC integration
        run: eas integrations:asc:status --json --non-interactive

      - name: Read TestFlight status
        run: eas submit:status --platform ios --profile production --json --non-interactive
