name: Apply PUSH TOTAL Trusted Session

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-total-trusted-session-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PUSH TOTAL RC
        uses: actions/checkout@v5
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply trusted session refinement
        run: node scripts/apply-push-total-trusted-session.js

      - name: Validate iOS bundle
        run: npx expo export --platform ios --output-dir dist-release-check

      - name: Commit validated RC
        run: |
          rm -rf dist-release-check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx package-lock.json
          if git diff --cached --quiet; then
            echo 'No app changes.'
          else
            git commit -m 'Refine PUSH TOTAL trusted pocket experience'
            git push origin HEAD:push-total-rc
          fi
