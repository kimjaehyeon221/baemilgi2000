name: Limit record edits to downward corrections

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/limit-record-edits.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prevent upward record edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()

          old_prompt = """  const promptFailureReps = (index: number) => {\n    const session = state.sessions[index];\n    Alert.prompt(\n      '실패 기록 수정',\n      `레벨 ${session.level}에서 몇 개까지 성공했어?`,\n      [\n        { text: '취소', style: 'cancel' },\n        {\n          text: '저장',\n          onPress: (value?: string) => {\n            const actualReps = Math.max(0, Math.floor(Number(value) || 0));\n            if (actualReps >= session.target) {\n              Alert.alert('목표 이상을 기록했어', `${session.target}개를 완료했다면 ‘성공으로 수정’을 선택해줘.`);\n              return;\n            }\n            saveEditedSession(index, { success: false, actualReps });\n          },\n        },\n      ],\n      'plain-text',\n      String(session.actualReps ?? 0),\n      'number-pad',\n    );\n  };\n"""
          new_prompt = """  const promptFailureReps = (index: number) => {\n    const session = state.sessions[index];\n    const previousReps = session.success ? session.target : session.actualReps ?? 0;\n    Alert.prompt(\n      session.success ? '성공 기록 낮추기' : '실패 기록 낮추기',\n      `레벨 ${session.level}에서 실제로 몇 개까지 했어? 기록은 낮추는 수정만 가능해.`,\n      [\n        { text: '취소', style: 'cancel' },\n        {\n          text: '저장',\n          onPress: (value?: string) => {\n            const actualReps = Math.max(0, Math.floor(Number(value) || 0));\n            if (actualReps >= session.target) {\n              Alert.alert('목표보다 낮은 횟수를 입력해줘', '성공 기록은 그대로 두거나 실제로 멈춘 횟수로 낮출 수 있어.');\n              return;\n            }\n            if (!session.success && actualReps > previousReps) {\n              Alert.alert('기록은 올릴 수 없어', '더 높은 횟수는 새 퀘스트 도전으로 남겨줘.');\n              return;\n            }\n            saveEditedSession(index, { success: false, actualReps });\n          },\n        },\n      ],\n      'plain-text',\n      String(session.success ? Math.max(0, session.target - 1) : previousReps),\n      'number-pad',\n    );\n  };\n"""
          if old_prompt not in text:
              raise SystemExit('failure record prompt block not found')
          text = text.replace(old_prompt, new_prompt, 1)

          old_actions = """        session.success\n          ? { text: '실패로 수정', onPress: () => promptFailureReps(index) }\n          : { text: '성공으로 수정', onPress: () => saveEditedSession(index, { success: true, actualReps: session.target }) },\n        ...(!session.success ? [{ text: '횟수 수정', onPress: () => promptFailureReps(index) }] : []),\n        { text: '기록 삭제', style: 'destructive' as const, onPress: () => deleteSession(index) },\n"""
          new_actions = """        { text: session.success ? '실패로 낮추기' : '횟수 낮추기', onPress: () => promptFailureReps(index) },\n        { text: '기록 삭제', style: 'destructive' as const, onPress: () => deleteSession(index) },\n"""
          if old_actions not in text:
              raise SystemExit('record edit action block not found')
          text = text.replace(old_actions, new_actions, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check core invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit edit restriction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/limit-record-edits.yml
          git add App.tsx
          git commit -m 'Prevent upward manual record edits'
          git push origin HEAD:main
