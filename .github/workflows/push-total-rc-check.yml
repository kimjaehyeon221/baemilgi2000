name: Push Total RC Check

on:
  push:
    branches:
      - push-total-rc
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

      - name: Expo config check
        run: npx expo config --type public > /dev/null
