name: Apply Baemilgi Visual Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-visual-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply rendered-screen polish
        run: python scripts/visual_polish_once.py

      - name: Install dependencies
        run: npm ci

      - name: Validate core progression invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit validated polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx src/Onboarding.tsx src/styles.ts
          git commit -m 'Polish Baemilgi onboarding and info sheet'
          git push origin HEAD:main
