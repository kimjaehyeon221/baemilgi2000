name: PUSH TOTAL Icon Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-icon-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate final icon
        run: python scripts/generate_push_total_icon.py

      - name: Validate icon
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/icon.png')
          assert im.size == (1024, 1024), im.size
          assert im.mode == 'RGB', im.mode
          print('ICON_OK', im.size, im.mode)
          PY

      - name: Commit icon
        run: |
          git config user.name 'kimcat'
          git config user.email '79156711+kimjaehyeon221@users.noreply.github.com'
          git add assets/icon.png
          if git diff --cached --quiet; then
            echo 'Icon already matches generated master.'
            exit 0
          fi
          git commit -m 'Replace PUSH TOTAL app icon'
          git push origin HEAD:push-total-rc
