name: PUSH TOTAL Pocket UX OTA Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-pocket-ux-ota-once.yml

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm run doctor
          npx expo config --type public >/dev/null

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview OTA
        env:
          CI: '1'
        run: eas update --channel preview --platform ios --message "PUSH TOTAL pocket preparation UX" --non-interactive
