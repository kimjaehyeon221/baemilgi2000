name: Apply Baemilgi Brand Intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-brand-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply brand intro patch
        run: |
          python scripts/apply_brand_intro.py
          python scripts/fix_brand_intro_type.py
      - name: Install dependencies
        run: npm ci
      - name: Validate core progression invariants
        run: bash scripts/check-core.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci
      - name: Commit validated intro
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Onboarding.tsx
          git commit -m 'Replace Baemilgi first screen with brand motion intro'
          git push origin HEAD:main
