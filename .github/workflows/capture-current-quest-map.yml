name: Capture Current Quest Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-current-quest-map.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install screenshot runtime
        run: |
          npm install
          npm install --no-save playwright react-dom@19.2.3 react-native-web@0.21.2 @expo/metro-runtime@57.0.14
          npx playwright install --with-deps chromium
      - name: Start web preview
        env:
          BROWSER: none
          EXPO_NO_TELEMETRY: '1'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.platforms=['ios','web'];
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE
          npx expo start --web --port 8092 > /tmp/baemilgi-expo.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8092 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/baemilgi-expo.log
          exit 1
      - name: Capture quest map
        run: |
          mkdir -p /tmp/baemilgi-current-map
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:440,height:956},deviceScaleFactor:3,isMobile:true,hasTouch:true,colorScheme:'light'});
            const state={
              onboarded:true,
              firstBaemilgiMax:null,
              clearedLevel:9,
              selectedLevel:10,
              sessions:[{at:'2026-09-02T05:20:00.000Z',type:'challenge',level:10,target:10,success:false,seconds:46,actualReps:9}],
            };
            await context.addInitScript(({key,value})=>localStorage.setItem(key,JSON.stringify(value)),{key:'baemilgi2000-ios-v1',value:state});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8092',{waitUntil:'networkidle'});
            await page.getByRole('tab',{name:'퀘스트'}).click();
            await page.getByText('QUEST MAP',{exact:true}).waitFor();
            await page.getByText('CURRENT',{exact:true}).waitFor();
            await page.getByText('CLEAR',{exact:true}).first().waitFor();
            const text=await page.locator('body').innerText();
            if(/\bDOJO\b/i.test(text)) throw new Error('stale DOJO copy visible');
            await page.screenshot({path:'/tmp/baemilgi-current-map/02-quest-map-stamps.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          file /tmp/baemilgi-current-map/02-quest-map-stamps.png
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baemilgi-current-quest-map
          path: /tmp/baemilgi-current-map/02-quest-map-stamps.png
          if-no-files-found: error
          retention-days: 14
