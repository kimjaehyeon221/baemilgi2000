name: PUSH TOTAL Add Expo Asset

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-add-expo-asset.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible asset module
        run: npx expo install expo-asset

      - name: Commit dependency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "Add required expo-asset dependency"
          git push origin push-total-rc
