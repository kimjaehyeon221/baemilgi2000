name: Apply PUSH TOTAL Brick UI

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/apply-brick-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout push-total-rc
        uses: actions/checkout@v4
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Restore masonry App.tsx
        run: |
          base64 --decode .brick-ui.payload | gzip --decompress > App.tsx
          grep -q "const BRICK_REPS = 100" App.tsx
          grep -q "type Screen = 'home' | 'wall' | 'session' | 'history'" App.tsx

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Commit masonry UI
        run: |
          rm .brick-ui.payload
          rm .github/workflows/apply-brick-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx package-lock.json .brick-ui.payload .github/workflows/apply-brick-ui.yml
          git commit -m "Apply PUSH TOTAL masonry brick UI"
          git push origin HEAD:push-total-rc
