name: Apply PUSH TOTAL Brick UI

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/apply-brick-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout push-total-rc
        uses: actions/checkout@v4
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Restore masonry App.tsx
        run: |
          cat .brick-ui.0 .brick-ui.1 .brick-ui.2 .brick-ui.3 .brick-ui.4 > /tmp/brick-ui.b64
          test "$(wc -c < /tmp/brick-ui.b64)" -eq 17336
          echo "ba24863e7103c4be84bac3505752762dd85c046e4abd9c59cb027c5eb8ec078c  /tmp/brick-ui.b64" | sha256sum -c -
          base64 --decode /tmp/brick-ui.b64 | gzip --decompress > App.tsx
          echo "c63534ff90385c84882e524bdd28c6c31b5b9f887d2169a4d6c4bf601bf580bb  App.tsx" | sha256sum -c -
          grep -q "const BRICK_REPS = 100" App.tsx
          grep -q "type Screen = 'home' | 'wall' | 'session' | 'history'" App.tsx

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Commit masonry UI
        run: |
          rm -f .brick-ui.payload .brick-ui.0 .brick-ui.1 .brick-ui.2 .brick-ui.3 .brick-ui.4
          rm .github/workflows/apply-brick-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply PUSH TOTAL masonry brick UI"
          git push origin HEAD:push-total-rc
