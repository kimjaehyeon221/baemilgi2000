name: Push Total Preview Build

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-preview-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue iOS preview build
        run: npx eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait --json
