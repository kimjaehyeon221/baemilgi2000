name: Audit dependencies once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-dependencies-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit without changing packages
        run: npm audit --json || true

      - name: Remove one-shot audit workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/audit-dependencies-once.yml
          git commit -m 'Remove one-shot dependency audit workflow'
          git push origin HEAD:main
