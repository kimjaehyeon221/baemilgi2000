name: PUSH TOTAL ASC Probe 12 Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-asc-probe-12-once.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Probe App Store Connect build 12
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const privateKey = process.env.ASC_API_KEY_P8;
          const appId = process.env.ASC_APP_ID;
          const b64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64url(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'}))}.${b64url(JSON.stringify({iss:issuerId,iat:now-5,exp:now+600,aud:'appstoreconnect-v1'}))}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${signature}`;
          (async () => {
            const url = `https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=${appId}&filter%5Bversion%5D=12&fields%5Bbuilds%5D=version,processingState,expired&limit=10`;
            const res = await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
            const body = await res.json();
            if (!res.ok) throw new Error(JSON.stringify(body));
            const build = body.data?.[0];
            console.log(build ? `BUILD_12_STATE ${build.attributes.processingState} ${build.id}` : 'BUILD_12_NOT_VISIBLE');
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE
