name: Capture Baemilgi UI Audit

# Render the current onboarding and release screens at the target phone viewport.
on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/Onboarding.tsx'
      - 'src/Workout.tsx'
      - 'assets/onboarding-dojo-v1.jpg'
      - '.github/workflows/baemilgi-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install web preview runtime
        run: |
          npm ci
          npm install --no-save playwright react-dom@19.2.3 react-native-web@0.21.2 @expo/metro-runtime@57.0.14
          npx playwright install --with-deps chromium
      - name: Start Baemilgi web preview
        env:
          BROWSER: none
          EXPO_NO_TELEMETRY: '1'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.platforms=['ios','web'];
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE
          npx expo start --web --port 8092 > /tmp/baemilgi-ui-audit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8092 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/baemilgi-ui-audit.log
          exit 1
      - name: Capture release screens
        run: |
          rm -rf docs/ui-audit
          mkdir -p docs/ui-audit
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const base={viewport:{width:440,height:956},deviceScaleFactor:2,isMobile:true,hasTouch:true,colorScheme:'light'};

            let context=await browser.newContext(base);
            let page=await context.newPage();
            await page.goto('http://127.0.0.1:8092',{waitUntil:'networkidle'});
            await page.getByRole('button',{name:'시작하기'}).waitFor();
            await page.screenshot({path:'docs/ui-audit/01-onboarding-intro.png'});
            await page.getByRole('button',{name:'시작하기'}).click();
            await page.getByText(/배밀기를/).waitFor();
            await page.screenshot({path:'docs/ui-audit/02-onboarding-choice.png'});
            await page.getByRole('button',{name:/처음이에요/}).click();
            await page.getByText('엉덩이를 높여 시작해.',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/03-onboarding-form.png'});
            await page.getByRole('button',{name:'다음 동작'}).click();
            await page.getByRole('button',{name:'다음 동작'}).click();
            await page.getByRole('button',{name:'1개 퀘스트 도전'}).click();
            await page.getByText('아직 시작 전',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/04-beginner-ready.png'});
            await page.getByRole('button',{name:'3 2 1 뒤 도전 시작'}).click();
            await page.getByText('자세를 잡아.',{exact:true}).waitFor();
            await page.waitForTimeout(240);
            await page.screenshot({path:'docs/ui-audit/04a-beginner-countdown.png'});
            await page.getByText('START',{exact:true}).waitFor();
            await page.waitForTimeout(180);
            await page.screenshot({path:'docs/ui-audit/04b-beginner-start.png'});
            await page.getByText('TARGET REPS',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/05-beginner-first-challenge.png'});
            await context.close();

            context=await browser.newContext(base);
            page=await context.newPage();
            await page.goto('http://127.0.0.1:8092',{waitUntil:'networkidle'});
            await page.getByRole('button',{name:'시작하기'}).click();
            await page.getByRole('button',{name:/해본 적 있어요/}).click();
            await page.getByRole('textbox',{name:'첫 도전 횟수'}).fill('1350');
            await page.getByRole('button',{name:/개 퀘스트 도전/}).waitFor();
            await page.screenshot({path:'docs/ui-audit/06-experienced-target-input.png'});
            await page.getByRole('button',{name:/개 퀘스트 도전/}).click();
            await page.getByText('아직 시작 전',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/07-experienced-ready.png'});
            await page.getByRole('button',{name:'3 2 1 뒤 도전 시작'}).click();
            await page.getByText('TARGET REPS',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/08-experienced-first-challenge.png'});
            await context.close();

            context=await browser.newContext(base);
            const state={
              onboarded:true,
              firstBaemilgiMax:35,
              clearedLevel:35,
              selectedLevel:36,
              sessions:[
                {at:'2026-08-30T01:00:00.000Z',type:'challenge',level:35,target:35,success:true,seconds:164,actualReps:35},
                {at:'2026-08-31T01:00:00.000Z',type:'training',level:36,target:36,success:true,seconds:420,trainingSets:4,trainingRepsPerSet:16,trainingRestSeconds:90}
              ]
            };
            await context.addInitScript(({key,value})=>localStorage.setItem(key,JSON.stringify(value)),{key:'baemilgi2000-ios-v1',value:state});
            page=await context.newPage();
            await page.goto('http://127.0.0.1:8092',{waitUntil:'networkidle'});
            await page.getByRole('button',{name:'START CHALLENGE'}).waitFor();
            await page.screenshot({path:'docs/ui-audit/09-home.png'});
            await page.getByRole('tab',{name:'퀘스트'}).click();
            await page.getByText('QUEST MAP',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/10-quests.png'});
            await page.getByRole('tab',{name:'홈'}).click();
            await page.getByRole('button',{name:'START CHALLENGE'}).click();
            await page.getByText('아직 시작 전',{exact:true}).waitFor();
            await page.getByRole('button',{name:'3 2 1 뒤 도전 시작'}).click();
            await page.getByText('TARGET REPS',{exact:true}).waitFor();
            await page.screenshot({path:'docs/ui-audit/11-challenge.png'});
            await page.getByRole('button',{name:'닫기'}).click();
            await page.getByRole('tab',{name:'기록'}).click();
            await page.getByText('DOJO TRAINING LOG',{exact:true}).first().waitFor();
            await page.screenshot({path:'docs/ui-audit/12-records.png'});
            await page.getByRole('button',{name:'정보 및 설정'}).click();
            await page.getByRole('button',{name:'정보 닫기'}).waitFor();
            await page.screenshot({path:'docs/ui-audit/13-info.png'});
            await context.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          file docs/ui-audit/*.png
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: baemilgi-ui-audit
          path: docs/ui-audit/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Commit screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ui-audit/*.png
          git commit -m 'Refresh Baemilgi onboarding screenshots' || exit 0
          git push origin HEAD:main
