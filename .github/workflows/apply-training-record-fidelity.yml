name: Apply Training Record Fidelity

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix_training_record_fidelity.py'
      - '.github/workflows/apply-training-record-fidelity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix training record fidelity
        run: python3 scripts/fix_training_record_fidelity.py
      - name: Install dependencies
        run: npm ci
      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-training-record-qa
      - name: Commit training record fidelity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/core.ts src/Workout.tsx DESIGN.md RELEASE_QA.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix BAEMILGI training record fidelity"
            git push origin main
          fi
