name: PUSH TOTAL Apple Upload 12 Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-apple-upload-12-once.yml

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Download EAS build 12 IPA
        run: |
          curl --fail --location --retry 3 \
            'https://expo.dev/artifacts/eas/-C5qJo2A4ipnFLYoB1JLJUoCl1KBUFBpezWr2Wuuj0I.ipa' \
            --output "$RUNNER_TEMP/push-total-12.ipa"
          test -s "$RUNNER_TEMP/push-total-12.ipa"
          ls -lh "$RUNNER_TEMP/push-total-12.ipa"

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          test -n "$ASC_API_KEY_P8"
          test -n "$ASC_KEY_ID"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload build 12 to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/push-total-12.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH" \
            --wait
