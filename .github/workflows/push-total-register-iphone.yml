name: Push Total Register iPhone

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start browser-based iPhone registration
        run: |
          eas workflow:run .eas/workflows/push-total-register-device.yml --non-interactive

          echo "### iPhone registration started" >> "$GITHUB_STEP_SUMMARY"
          echo "The EAS device-registration workflow was uploaded directly from the push-total-rc branch, so a GitHub↔Expo repository connection is not required for this step." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the PUSH TOTAL Workflows page and select the newest **PUSH TOTAL - Register iPhone** run. It should be waiting for action and show the device registration / QR flow." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://expo.dev/accounts/magpie221/projects/push-total/workflows" >> "$GITHUB_STEP_SUMMARY"
