name: PUSH TOTAL Finalize Review Metadata Once

on:
  push:
    branches: [push-total-rc]
    paths:
      - '.github/workflows/push-total-finalize-review-metadata-once.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      ASC_APP_ID: '6806938654'
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
    steps:
      - name: Prepare API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Finalize category rights and review notes
        run: |
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const appId=process.env.ASC_APP_ID, keyId=process.env.ASC_KEY_ID, issuer=process.env.ASC_ISSUER_ID;
          const privateKey=fs.readFileSync(process.env.ASC_KEY_PATH,'utf8');
          const b64=v=>Buffer.from(v).toString('base64url');
          function token(){const now=Math.floor(Date.now()/1000); const u=`${b64(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'}))}.${b64(JSON.stringify({iss:issuer,iat:now-5,exp:now+600,aud:'appstoreconnect-v1'}))}`; const s=crypto.sign('sha256',Buffer.from(u),{key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url'); return `${u}.${s}`;}
          async function asc(path,options={}){const h={Authorization:`Bearer ${token()}`}; if(options.body)h['Content-Type']='application/json'; const r=await fetch(`https://api.appstoreconnect.apple.com${path}`,{method:options.method||'GET',headers:h,body:options.body?JSON.stringify(options.body):undefined}); const t=await r.text(); const b=t?JSON.parse(t):null; if(!r.ok){const e=new Error(`${r.status} ${path}`);e.status=r.status;e.body=b;throw e;} return b;}
          (async()=>{
            const versions=await asc(`/v1/apps/${appId}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50`);
            const version=(versions.data||[]).find(v=>v.attributes?.versionString==='1.0'); if(!version)throw new Error('Version 1.0 missing');
            const review=(await asc(`/v1/appStoreVersions/${version.id}/appStoreReviewDetail`)).data;
            const notes=`PUSH TOTAL does not require an account or sign-in.\n\nPocket Count test flow:\n1. Tap Pocket Count.\n2. During the first 5 seconds, place the iPhone fully in a front pants pocket.\n3. During the next 5 seconds, get into and hold the push-up start position.\n4. A start sound and haptic indicate measurement has begun.\n5. Perform push-ups at a natural cadence.\n6. After the final rep, remain still for 5 seconds; the set ends automatically.\n7. The detected count can be corrected only within ±10 before saving.\n\nMotion permission is required. The app does not use the camera. Push-up history stays on-device.`;
            await asc(`/v1/appStoreReviewDetails/${review.id}`,{method:'PATCH',body:{data:{type:'appStoreReviewDetails',id:review.id,attributes:{notes,demoAccountRequired:false}}}});
            console.log('REVIEW_NOTES_SET=true');

            const rel=await asc(`/v1/apps/${appId}/relationships/appInfos`); const infoId=rel.data?.[0]?.id; if(!infoId)throw new Error('App Info missing');
            await asc(`/v1/appInfos/${infoId}`,{method:'PATCH',body:{data:{type:'appInfos',id:infoId,attributes:{contentRightsDeclaration:'DOES_NOT_USE_THIRD_PARTY_CONTENT'}}}});
            console.log('CONTENT_RIGHTS_SET=true');

            const cats=await asc('/v1/appCategories?limit=200');
            const candidates=(cats.data||[]).filter(c=>{const id=String(c.id||'').toUpperCase(); const n=String(c.attributes?.name||'').toLowerCase(); return id.includes('HEALTH')||n.includes('health')||n.includes('fitness');});
            console.log('CATEGORY_CANDIDATES='+JSON.stringify(candidates.map(c=>({id:c.id,name:c.attributes?.name,platforms:c.attributes?.platforms}))));
            const health=candidates.find(c=>String(c.id).toUpperCase().includes('HEALTH_AND_FITNESS')) || candidates.find(c=>String(c.attributes?.name||'').toLowerCase()==='health & fitness');
            if(!health) throw new Error('Health & Fitness category not found');
            await asc(`/v1/appInfos/${infoId}`,{method:'PATCH',body:{data:{type:'appInfos',id:infoId,relationships:{primaryCategory:{data:{type:'appCategories',id:health.id}}}}}});
            const verify=await asc(`/v1/appInfos/${infoId}?include=primaryCategory`);
            const primary=(verify.included||[]).find(x=>x.type==='appCategories');
            console.log('PRIMARY_CATEGORY_SET='+String(primary?.id===health.id));
            console.log('PRIMARY_CATEGORY_ID='+(primary?.id||''));
          })().catch(e=>{console.error(e.stack||e);if(e.body)console.error(JSON.stringify(e.body));process.exit(1)});
          NODE
