name: Apply PUSH TOTAL Brick Milestones

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-total-brick-milestones-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PUSH TOTAL RC
        uses: actions/checkout@v5
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply brick milestone patch
        run: node scripts/apply-push-total-brick-milestones.js

      - name: Typecheck
        run: npm run typecheck

      - name: Validate iOS bundle
        run: npx expo export --platform ios --output-dir dist-brick-check

      - name: Commit validated RC
        run: |
          rm -rf dist-brick-check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx
          if git diff --cached --quiet; then
            echo 'No PUSH TOTAL brick milestone changes to commit.'
            exit 0
          fi
          git commit -m 'Add PUSH TOTAL brick milestone feedback'
          git push origin HEAD:push-total-rc
