name: Release Dependency Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-dependency-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency tree
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-production.json', 'utf8'));
          console.log('PRODUCTION AUDIT COUNTS');
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          const rows = Object.entries(audit.vulnerabilities ?? {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: value.isDirect,
            range: value.range,
            fixAvailable: value.fixAvailable,
            via: (value.via ?? []).map((item) => typeof item === 'string' ? item : `${item.name}: ${item.title}`),
          }));
          console.log('PRODUCTION AUDIT DETAILS');
          console.log(JSON.stringify(rows, null, 2));
          NODE
