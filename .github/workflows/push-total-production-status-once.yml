name: PUSH TOTAL Production Status Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-production-status-once.yml

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Read production build status
        run: eas build:view 0a9267da-d525-445e-a271-e196c6e7483a --json
