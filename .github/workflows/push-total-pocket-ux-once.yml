name: PUSH TOTAL Pocket UX Once

on:
  push:
    branches: [push-total-rc]
    paths:
      - .github/workflows/push-total-pocket-ux-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: push-total-rc
          fetch-depth: 0

      - name: Patch UX
        run: node scripts/update-push-total-pocket-ux.mjs

      - name: Validate
        run: |
          npm ci
          npx tsc --noEmit
          npx expo-doctor
          npx expo config --type public >/dev/null

      - name: Commit
        run: |
          git config user.name "kimcat"
          git config user.email "79156711+kimjaehyeon221@users.noreply.github.com"
          git add App.tsx
          git commit -m "Clarify PUSH TOTAL pocket preparation UX"
          git push origin HEAD:push-total-rc
