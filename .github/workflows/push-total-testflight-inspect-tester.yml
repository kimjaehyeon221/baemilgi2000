name: Inspect PUSH TOTAL TestFlight Tester

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-total-testflight-inspect-tester.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Inspect tester and user relationships
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_APP_ID: '6806938654'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const key = process.env.ASC_API_KEY_P8;
          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;
          const appId = process.env.ASC_APP_ID;
          if (!key || !keyId || !issuerId || !appId) throw new Error('Missing required App Store Connect configuration');

          const b64url = v => Buffer.from(v).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const h = b64url(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' }));
          const p = b64url(JSON.stringify({ iss: issuerId, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }));
          const input = `${h}.${p}`;
          const sig = crypto.sign('sha256', Buffer.from(input), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${input}.${sig}`;

          async function asc(path) {
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, { headers: { Authorization: `Bearer ${token}` } });
            const text = await res.text();
            let body = null;
            if (text) { try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 300) }; } }
            if (!res.ok) throw new Error(`ASC ${res.status} ${path}: ${JSON.stringify(body)}`);
            return body;
          }

          (async () => {
            const [testers, users, groups, builds] = await Promise.all([
              asc('/v1/betaTesters?limit=200'),
              asc('/v1/users?limit=200&include=visibleApps&limit%5BvisibleApps%5D=50'),
              asc(`/v1/betaGroups?filter%5Bapp%5D=${appId}&limit=200`),
              asc(`/v1/builds?filter%5Bapp%5D=${appId}&sort=-uploadedDate&limit=20`)
            ]);

            const eligibleRoles = new Set(['ACCOUNT_HOLDER','ADMIN','APP_MANAGER','DEVELOPER','MARKETING']);
            const eligibleUsers = (users.data || []).filter(user => {
              const roleEligible = (user.attributes?.roles || []).some(role => eligibleRoles.has(role));
              const appVisible = Boolean(user.attributes?.allAppsVisible) || (user.relationships?.visibleApps?.data || []).some(app => app.id === appId);
              return roleEligible && appVisible;
            });
            const testerByEmail = new Map((testers.data || []).filter(t => t.attributes?.email).map(t => [String(t.attributes.email).trim().toLowerCase(), t]));
            const matches = eligibleUsers.map(user => ({ user, tester: testerByEmail.get(String(user.attributes?.username || '').trim().toLowerCase()) })).filter(x => x.tester);
            if (matches.length !== 1) throw new Error(`Expected exactly one matched eligible tester; found ${matches.length}`);

            const { user, tester } = matches[0];
            const [testerApps, testerGroups, userApps] = await Promise.all([
              asc(`/v1/betaTesters/${tester.id}/relationships/apps?limit=200`),
              asc(`/v1/betaTesters/${tester.id}/relationships/betaGroups?limit=200`),
              asc(`/v1/users/${user.id}/relationships/visibleApps?limit=200`)
            ]);

            const targetInternalGroups = (groups.data || []).filter(g => g.attributes?.isInternalGroup);
            const latest = builds.data?.[0] || null;

            const report = {
              checkedAt: new Date().toISOString(),
              appId,
              latestBuild: latest ? {
                buildNumber: latest.attributes?.version || null,
                processingState: latest.attributes?.processingState || null,
                expired: Boolean(latest.attributes?.expired)
              } : null,
              tester: {
                state: tester.attributes?.state || null,
                inviteType: tester.attributes?.inviteType || null,
                hasTargetAppRelationship: (testerApps.data || []).some(a => a.id === appId),
                appRelationshipCount: testerApps.data?.length || 0,
                betaGroupRelationshipCount: testerGroups.data?.length || 0,
                alreadyInTargetInternalGroup: (testerGroups.data || []).some(g => targetInternalGroups.some(tg => tg.id === g.id))
              },
              appStoreConnectUser: {
                roles: user.attributes?.roles || [],
                allAppsVisible: Boolean(user.attributes?.allAppsVisible),
                provisioningAllowed: user.attributes?.provisioningAllowed ?? null,
                visibleAppCount: userApps.data?.length || 0,
                targetAppVisible: Boolean(user.attributes?.allAppsVisible) || (userApps.data || []).some(a => a.id === appId)
              },
              internalGroups: targetInternalGroups.map(g => ({
                name: g.attributes?.name || null,
                hasAccessToAllBuilds: Boolean(g.attributes?.hasAccessToAllBuilds),
                isInternalGroup: true
              }))
            };

            fs.mkdirSync('docs', { recursive: true });
            fs.writeFileSync('docs/PUSH_TOTAL_TESTER_STATE.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Persist sanitized tester state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PUSH_TOTAL_TESTER_STATE.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
          else
            git commit -m 'Record PUSH TOTAL tester state'
            git push origin HEAD:main
          fi
