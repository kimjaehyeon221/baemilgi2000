name: PUSH TOTAL Build History Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-build-history-once.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: List recent iOS builds
        run: eas build:list --platform ios --limit 10 --json --non-interactive
