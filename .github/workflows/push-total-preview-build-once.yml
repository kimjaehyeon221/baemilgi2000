name: PUSH TOTAL Preview Build Once

on:
  push:
    branches:
      - push-total-rc
    paths:
      - .github/workflows/push-total-preview-build-once.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue iOS preview build
        run: eas build --platform ios --profile preview --non-interactive --refresh-ad-hoc-provisioning-profile --no-wait --json
