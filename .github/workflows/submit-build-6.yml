name: One-time TestFlight upload for build 6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/submit-build-6.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit existing iOS build to App Store Connect
        run: npx eas-cli@latest submit --platform ios --id ae7be0d2-131e-455e-aa68-79712a109de1 --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
