name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-production-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate core progression invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      # Build 10 is the current TestFlight QA binary. For JS/UI-only changes we publish
      # against its embedded runtime. Any native dependency/config change requires a new build.
      - name: Resolve TestFlight build 10 runtime
        run: |
          npx eas-cli@latest build:view 9c14fcf7-6a78-4557-bffa-a44e3c19884b --json > build10.json
          RUNTIME=$(jq -r '.runtime.version // empty' build10.json)
          test -n "$RUNTIME" || { echo "Could not resolve build 10 runtime"; cat build10.json; exit 1; }
          echo "BAEMILGI_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "Resolved build 10 runtime: $RUNTIME"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Target TestFlight build 10 runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.runtimeVersion = process.env.BAEMILGI_RUNTIME;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Publish production OTA update
        run: npx eas-cli@latest update --channel production --platform ios --environment production --non-interactive --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
