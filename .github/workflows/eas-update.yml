name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-production-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show installed TestFlight build metadata
        run: npx eas-cli@latest build:view ae7be0d2-131e-455e-aa68-79712a109de1 --json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish production OTA update
        run: npx eas-cli@latest update --channel production --non-interactive --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
