name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-production-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TestFlight 1.0.0 (6) is the current iPhone QA binary.
      # Keep UI/JS OTA updates on its embedded runtime during this design-test cycle.
      # Remove this pin and return to fingerprint policy after the next native/TestFlight build.
      - name: Target current iPhone QA runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.runtimeVersion = 'ea71c3db70d60cdfe0ebd633322eaaa05d1e7287';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Publish production OTA update
        run: npx eas-cli@latest update --channel production --platform ios --environment production --non-interactive --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
