name: EAS OTA Update

# Trigger refresh: challenge countdown + training progress fixes
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-production-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate core progression invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      # Build 10 is the current TestFlight QA binary. For JS/UI-only changes we publish
      # against its embedded runtime. Any native dependency/config change requires a new build.
      - name: Resolve TestFlight build 10 runtime
        run: |
          echo 'BAEMILGI_RUNTIME=b12b6591130964d0702aae7e8e15f3d1c31fbd15' >> "$GITHUB_ENV"
          echo 'Targeting the verified TestFlight build 10 runtime.'

      - name: Target TestFlight build 10 runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.runtimeVersion = process.env.BAEMILGI_RUNTIME;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Publish production OTA update
        run: |
          for attempt in 1 2 3; do
            echo "Production OTA publish attempt $attempt/3"
            if npx eas-cli@latest update --channel production --platform ios --environment production --non-interactive --message "${{ github.event.head_commit.message || 'Manual BAEMILGI production OTA update' }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo 'Expo update service is unavailable; retrying in 20 seconds.'
              sleep 20
            fi
          done
          exit 1
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
