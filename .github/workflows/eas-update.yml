name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update.yml'

concurrency:
  group: eas-production-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      # TestFlight 1.0.0 (6) is the current iPhone QA binary.
      # Keep JS-only release QA fixes on its embedded runtime until the next native build.
      # This batch includes typography, tap/legibility/accessibility, data-safety,
      # long-history access, onboarding back navigation, and sequential quest progression.
      # Remove this pin before any native dependency/config change is shipped.
      - name: Target current iPhone QA runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.runtimeVersion = 'ea71c3e10e66915f06d625ac29bfb39b6a6d7b8d';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Publish production OTA update
        run: npx eas-cli@latest update --channel production --platform ios --environment production --non-interactive --message "${{ github.event.head_commit.message }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
