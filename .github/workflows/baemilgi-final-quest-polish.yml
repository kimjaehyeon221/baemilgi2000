name: Apply Baemilgi Final Quest Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baemilgi-final-quest-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply Baemilgi-only product polish
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'App.tsx',
              "  const nextLevel = state.clearedLevel >= 200 ? 200 : state.clearedLevel + 1;\n  const nextTarget = targetForLevel(nextLevel);",
              "  const journeyComplete = state.clearedLevel >= 200;\n  const nextLevel = journeyComplete ? 200 : state.clearedLevel + 1;\n  const nextTarget = targetForLevel(nextLevel);",
          )

          replace_once(
              'App.tsx',
              "            <View style={[styles.chapterRibbon, { backgroundColor: currentChapter.color }]} accessible accessibilityLabel={`${currentChapter.name} 훈련 챕터, 퀘스트 ${currentChapter.startLevel}부터 ${currentChapter.endLevel}`}>\n              <Text style={[styles.chapterRibbonName, { color: currentChapter.textColor }]}>{currentChapter.name}</Text>\n              <Text style={[styles.chapterRibbonMeta, { color: currentChapter.textColor }]}>{currentChapter.label} · Q{String(currentChapter.startLevel).padStart(3, '0')}—{String(currentChapter.endLevel).padStart(3, '0')}</Text>\n            </View>",
              "            {journeyComplete ? (\n              <View\n                style={[styles.chapterRibbon, { backgroundColor: '#121212' }]}\n                accessible\n                accessibilityLabel=\"200개 퀘스트 완료. 최종 퀘스트 2,000개 달성\"\n              >\n                <Text style={[styles.chapterRibbonName, { color: '#FAF9F6' }]}>200 / 200</Text>\n                <Text style={[styles.chapterRibbonMeta, { color: '#FAF9F6' }]}>FINAL QUEST CLEARED · 2,000</Text>\n              </View>\n            ) : (\n              <View style={[styles.chapterRibbon, { backgroundColor: currentChapter.color }]} accessible accessibilityLabel={`${currentChapter.name} 훈련 챕터, 퀘스트 ${currentChapter.startLevel}부터 ${currentChapter.endLevel}`}>\n                <Text style={[styles.chapterRibbonName, { color: currentChapter.textColor }]}>{currentChapter.name}</Text>\n                <Text style={[styles.chapterRibbonMeta, { color: currentChapter.textColor }]}>{currentChapter.label} · Q{String(currentChapter.startLevel).padStart(3, '0')}—{String(currentChapter.endLevel).padStart(3, '0')}</Text>\n              </View>\n            )}",
          )

          replace_once(
              'App.tsx',
              "              <Button label=\"START CHALLENGE\" onPress={() => setChallengeLevel(nextLevel)} />\n              <Button label=\"TRAINING\" secondary onPress={() => setTrainingLevel(nextLevel)} />",
              "              <Button label={journeyComplete ? '2,000 다시 도전' : 'START CHALLENGE'} onPress={() => setChallengeLevel(nextLevel)} />\n              <Button label={journeyComplete ? '2,000 TRAINING' : 'TRAINING'} secondary onPress={() => setTrainingLevel(nextLevel)} />",
          )

          replace_once(
              'App.tsx',
              "                <Text style={styles.questHeroCopy}>다음 도전</Text>",
              "                <Text style={styles.questHeroCopy}>{journeyComplete ? '최종 퀘스트 완료' : '다음 도전'}</Text>",
          )

          replace_once(
              'App.tsx',
              "            <Text style={styles.questProgressCopy}>{state.clearedLevel}단계 완료 · 200단계까지 {200 - state.clearedLevel}단계</Text>",
              "            <Text style={styles.questProgressCopy}>\n              {journeyComplete\n                ? '200단계 완료 · FINAL QUEST CLEARED'\n                : `${state.clearedLevel}단계 완료 · 200단계까지 ${200 - state.clearedLevel}단계`}\n            </Text>",
          )

          replace_once(
              'App.tsx',
              "          if (success && clearedLevel >= 200) setMessage('2,000. 마지막 퀘스트를 완료했어.');\n          else if (success && targetForLevel(old || 1) < 500 && targetForLevel(clearedLevel || 1) >= 500) {\n            setMessage('500개를 넘었어. 최종 목표는 2,000개야.');\n          } else {",
              "          if (success && clearedLevel >= 200) setMessage('2,000. 마지막 퀘스트를 완료했어.');\n          else if (success && targetForLevel(old || 1) < 1000 && targetForLevel(clearedLevel || 1) >= 1000) {\n            setMessage('1,000개 관문을 넘었어. 마지막 퀘스트까지 절반 남았어.');\n          } else if (success && targetForLevel(old || 1) < 500 && targetForLevel(clearedLevel || 1) >= 500) {\n            setMessage('500개를 넘었어. 최종 목표는 2,000개야.');\n          } else {",
          )

          replace_once(
              'src/core.ts',
              "  pushupMax: number | null;\n",
              "",
          )
          replace_once(
              'src/core.ts',
              "  pushupMax: null,\n",
              "",
          )
          replace_once(
              'src/core.ts',
              "    pushupMax: Number.isFinite(raw?.pushupMax) ? Math.min(2000, Math.max(0, Math.floor(raw.pushupMax))) : null,\n",
              "",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate core progression invariants
        run: bash scripts/check-core.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate iOS bundle
        run: CI=1 npx expo export --platform ios --output-dir dist-ci

      - name: Commit validated polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx src/core.ts
          git commit -m 'Polish Baemilgi final quest completion state'
          git push origin HEAD:main
