name: Push Total EAS Status

# Read-only diagnostics for EAS/Apple integration state. Never starts a build.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/push-total-eas-status.yml

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Inspect App Store Connect integration
        run: |
          set +e
          echo "===== ASC INTEGRATION ====="
          eas integrations:asc:status --json --non-interactive
          echo "===== TESTFLIGHT / STORE STATUS ====="
          eas submit:status --platform ios --profile production --json --non-interactive
          echo "===== PROJECT CONFIG ====="
          eas config --platform ios --profile production --json --non-interactive \
            | jq '{projectId:.projectId,accountName:.accountName,buildProfile:.buildProfile,submitProfile:.submitProfile}'
