name: Push Total EAS Status

# Read-only diagnostics for EAS workflow/build state. Never starts a build.
on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: EAS workflow run ID (optional)
        required: false
        type: string
      build_id:
        description: EAS build ID (optional)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/push-total-eas-status.yml

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSH TOTAL release candidate
        uses: actions/checkout@v5
        with:
          ref: push-total-rc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies for config resolution
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Inspect EAS build log encoding
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -u
          BUILD_IDS="$INPUT_BUILD_ID"
          if [ -z "$BUILD_IDS" ]; then
            BUILD_IDS="27ac3e8f-e7b0-416d-b771-e79f5a5bb68c 14394abe-fbc3-4466-913c-6a487b5abc12"
          fi

          for BUILD_ID in $BUILD_IDS; do
            echo "===== BUILD $BUILD_ID ====="
            RAW=$(eas build:view "$BUILD_ID" --json 2>&1 || true)
            JSON=$(printf '%s\n' "$RAW" | sed -n '/^{/,$p')
            if [ -z "$JSON" ] || ! printf '%s\n' "$JSON" | jq -e . >/dev/null 2>&1; then
              echo "Could not parse EAS build metadata."
              continue
            fi
            printf '%s\n' "$JSON" | jq '{id,status,error,logFileCount:(.logFiles // [] | length)}'

            LOG_INDEX=0
            printf '%s\n' "$JSON" | jq -r '.logFiles[]?' | while IFS= read -r LOG_URL; do
              [ -z "$LOG_URL" ] && continue
              LOG_INDEX=$((LOG_INDEX + 1))
              LOG_PATH="/tmp/eas-${BUILD_ID}-${LOG_INDEX}.log"
              curl -fsS "$LOG_URL" -o "$LOG_PATH" || { echo "Could not read log $LOG_INDEX"; continue; }
              echo "--- log $LOG_INDEX format ---"
              file "$LOG_PATH" || true
              wc -c "$LOG_PATH" || true
              echo "--- first 96 bytes (hex only) ---"
              xxd -l 96 "$LOG_PATH" || true
              echo "--- ASCII strings sample ---"
              strings -a -n 4 "$LOG_PATH" \
                | sed -E 's#https://[^ ]+#<url redacted>#g' \
                | head -n 80 || true
              echo "--- UTF-16LE strings sample ---"
              strings -a -el -n 4 "$LOG_PATH" \
                | sed -E 's#https://[^ ]+#<url redacted>#g' \
                | head -n 80 || true
            done
          done
