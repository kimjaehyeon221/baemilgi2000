<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배밀기 2000 지원</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;line-height:1.75;color:#191816}h1{font-size:34px}</style></head><body><h1>배밀기 2000 지원</h1><p><b>앱이 하는 일</b><br>배밀기 기록을 200개의 Quest로 관리하고, 원하는 레벨에 도전하거나 현재 수준에 맞는 보조 훈련을 할 수 있게 돕습니다.</p><p><b>운동 중 주의</b><br>통증, 어지럼 또는 비정상적인 불편감이 있으면 즉시 중단하세요. 2,000회는 의학적 권장량이 아니라 앱의 상징적인 마지막 Quest입니다.</p><p><b>기록 초기화</b><br>앱 오른쪽 상단 메뉴에서 기록을 초기화할 수 있습니다.</p></body></html>
